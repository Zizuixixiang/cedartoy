[program:cedartoy]
command=python3 /opt/cedartoy/server.py
directory=/opt/cedartoy
autostart=true
autorestart=true
stderr_logfile=/var/log/cedartoy.err.log
stdout_logfile=/var/log/cedartoy.out.log
user=root

[program:cedartoy-camping-plaza]
command=python3 -m uvicorn camping_plaza_adapter:app --host 127.0.0.1 --port 8773 --workers 1
directory=/opt/cedartoy
environment=CAMPING_PLAZA_DB_PATH="/opt/cedartoy/data/camping_plaza.db"
autostart=true
autorestart=true
stderr_logfile=/var/log/cedartoy-camping-plaza.err.log
stdout_logfile=/var/log/cedartoy-camping-plaza.out.log
user=root
