<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deeptalk · CEDAR TOY</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { --bg:#FDF6F7; --purple:#BEB1D1; --purple-dark:#9B8DB5; --purple-light:#E6DFF0; --pink:#E6A8B1; --text:#5C5463; --muted:#716978; --card:#fff; }
body { margin:0; min-height:100vh; color:var(--text); background:var(--bg); background-image:linear-gradient(rgba(190,177,209,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(190,177,209,.1) 1px,transparent 1px); background-size:20px 20px; font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
button,select,textarea { font:inherit; color:inherit; }
button,a,select { touch-action:manipulation; }
button { cursor:pointer; }
a { color:var(--text); }
[hidden] { display:none !important; }
.topbar { min-height:60px; padding:10px clamp(14px,4vw,30px); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; background:var(--purple); border-bottom:4px solid var(--purple-dark); }
.topbar a { color:#42364C; }
.brand { font-size:20px; font-weight:700; text-decoration:none; }
.back-link { font-size:12px; padding:8px; border:2px solid currentColor; text-decoration:none; }
main { width:min(920px,calc(100% - 28px)); margin:auto; padding:28px 0 calc(40px + env(safe-area-inset-bottom,0px)); }
h1 { margin:0 0 6px; font-size:clamp(26px,7vw,38px); line-height:1.2; }
h2 { margin:0 0 12px; font-size:22px; line-height:1.5; }
h3 { font-size:18px; }
p { margin:10px 0; }
.lead,.hint { font-size:13px; color:var(--muted); }
.shell { margin-top:22px; padding:clamp(18px,4vw,34px); background:var(--card); border:4px solid var(--purple); box-shadow:8px 8px 0 var(--purple-light); }
label { display:block; margin:18px 0 6px; font-size:14px; font-weight:600; }
select,textarea { width:100%; min-width:0; padding:10px; border:2px solid var(--purple-dark); background:#fff; border-radius:0; }
select { min-height:44px; }
textarea { min-height:120px; resize:vertical; line-height:1.65; }
.actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:18px; }
.pixel-btn { min-height:44px; padding:9px 16px; border:2px solid var(--purple-dark); background:var(--purple-light); box-shadow:3px 3px 0 var(--purple); font-size:14px; text-decoration:none; }
.pixel-btn.secondary { background:#fff; }
button:disabled { cursor:default; opacity:.55; box-shadow:none; }
:focus-visible { outline:3px solid #716080; outline-offset:3px; }
#message { margin:8px 0; font-size:14px; overflow-wrap:anywhere; }
#message:empty { display:none; }
#message.error,#confirmError { color:#9b3245; }
#progress { margin:6px 0; }
#questionText { margin:12px 0; font-size:clamp(18px,4vw,23px); white-space:pre-wrap; overflow-wrap:anywhere; }
#round { margin-top:14px; padding:clamp(14px,3vw,26px); }
#roundTitle { margin-bottom:4px; }
#roundDescription { margin:4px 0; }
.question-picker { display:flex; align-items:center; gap:10px; margin-top:10px; }
.question-picker label { margin:0; font-size:13px; white-space:nowrap; }
#questionJump { width:auto; max-width:100%; padding:6px 10px; font-size:14px; }
#answerLabel { margin:10px 0 4px; }
#saveHint,#liveHint { margin:6px 0; }
#liveHint:empty,#confirmError:empty { display:none; }
.question-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.question-actions button { min-width:0; padding:9px 8px; }
#newRound { display:inline-block; min-height:44px; padding:10px 0; margin-top:10px; font-size:13px; text-underline-offset:3px; }
.record h3 { overflow-wrap:anywhere; }
.record { padding:20px 0; border-top:2px dashed var(--purple-light); }
.answer-pair { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.answer-pair p,.own-answer { white-space:pre-wrap; overflow-wrap:anywhere; }
.answer-pair b { font-size:13px; }
summary { cursor:pointer; min-height:44px; padding:10px 0; font-size:14px; }
#sourceBody { font-size:13px; overflow-wrap:anywhere; }
#sources { padding-top:8px; padding-bottom:8px; }
#sourceBody p { margin:6px 0; }
.source-entry { padding:12px 0; border-top:2px dashed var(--purple-light); }
.source-entry a { text-underline-offset:3px; }
#topicTitle,#roundTitle { overflow-wrap:anywhere; }
dialog { max-width:min(480px,calc(100% - 28px)); padding:24px; border:4px solid var(--purple); color:var(--text); background:#fff; }
dialog::backdrop { background:rgba(50,40,60,.45); }
@media(max-width:599px) { main { padding-top:18px; } .answer-pair { grid-template-columns:1fr; gap:4px; } .shell { box-shadow:5px 5px 0 var(--purple-light); } h2 { font-size:20px; } }
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/">CEDAR TOY</a><a class="back-link" href="/">返回首页 / 历史</a></header>
<main>
<h1>Deeptalk</h1><p class="lead">两个人，慢慢聊。无标准答案、无分数，不做匹配度或心理诊断。</p>
<p id="message" role="status" aria-live="polite">正在读取…</p>
<section id="login" class="shell" hidden><h2>先登录，再开始</h2><p>请使用你的人类账号登录，和已绑定的小机一起作答。</p><a class="pixel-btn" href="/">去首页登录</a></section>
<section id="chooseTopic" class="shell" hidden><h2>从首页选择题库</h2><p class="hint">每套题库都有独立入口，选好后就可以开始聊。</p><div class="actions"><a class="pixel-btn" href="/">去首页选择题库</a></div></section>
<section id="setup" class="shell" hidden>
<h2 id="topicTitle"></h2><p id="topicDescription" class="hint"></p>
<label for="mode">怎么聊</label><select id="mode"><option value="blind">答完再看</option><option value="chat">边聊边答</option></select>
<p id="modeIntro" class="hint">答完再看：双方答完后互相查看。</p>
<p id="bindingHint" class="hint"></p><div class="actions"><button id="create" class="pixel-btn" type="button">开始新一轮</button></div>

</section>
<section id="round" class="shell" hidden>
<h2 id="roundTitle"></h2><p id="roundDescription" class="hint"></p><p id="progress" class="hint" hidden></p>
<div id="editor">
<div class="question-picker"><label for="questionJump">选题</label><select id="questionJump"></select></div>
<h3 id="questionText" tabindex="-1"></h3><label id="answerLabel" for="answer">你的回答</label><textarea id="answer" rows="4" maxlength="8000" placeholder="写下你的想法…" aria-describedby="saveHint"></textarea><p id="ownRead" class="own-answer" hidden></p>
<p id="saveHint" class="hint">换题时自动保存，留空则跳过。</p>
<div class="question-actions"><button id="previous" class="pixel-btn secondary" type="button">上一题</button><button id="next" class="pixel-btn" type="button">下一题</button></div>
</div>
<div id="peerAnswer" class="record" hidden><h3>小机的回答</h3><p id="peerText" class="own-answer"></p></div>
<p id="liveHint" class="hint" role="status"></p>
<div id="records" hidden></div><a id="newRound" href="/deeptalk" hidden>重新答题</a>
</section>
<details id="sources" class="shell" hidden><summary>来源与作者</summary><div id="sourceBody"></div></details>
<dialog id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmText"><h2 id="confirmTitle">正式提交整卷？</h2><p id="confirmText"></p><p id="confirmError" class="hint" role="alert"></p><div class="actions"><button id="cancelSubmit" class="pixel-btn secondary" type="button" autofocus>再检查一下</button><button id="confirmSubmit" class="pixel-btn" type="button">正式提交</button></div></dialog>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let polling = false, viewVersion = 0, remoteChanged = false;
let context, topic, state, index = 0, busy = false, dirty = false, pendingAnswer = null, pendingCreate = null;
const initialToken = localStorage.getItem('cedartoy_token') || '';
const pageParams = new URLSearchParams(location.search);
let roundId = pageParams.get('round_id');
const requestedTopicId = pageParams.get('topic_id');
function key() {
  const cryptoApi = window.crypto;
  if (typeof cryptoApi?.randomUUID === 'function') {
    try { return cryptoApi.randomUUID(); } catch (_) { /* Try the secure fallback. */ }
  }
  // Older WebViews and HTTP pages may expose getRandomValues but not randomUUID.
  // Keep UUID v4 request IDs and the existing retry/idempotency protocol.
  const bytes = new Uint8Array(16);
  try {
    if (typeof cryptoApi?.getRandomValues !== 'function') throw new Error();
    cryptoApi.getRandomValues(bytes);
  } catch (_) {
    throw new Error('当前浏览器无法生成安全请求编号，本次操作尚未保存。请保留当前输入，使用支持安全随机数的浏览器重试。');
  }
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  const hex = Array.from(bytes, value => value.toString(16).padStart(2, '0'));
  return `${hex.slice(0,4).join('')}-${hex.slice(4,6).join('')}-${hex.slice(6,8).join('')}-${hex.slice(8,10).join('')}-${hex.slice(10).join('')}`;
}
function setText(id, text) { if ($(id).textContent !== text) $(id).textContent = text; }
function message(text, error = false) { setText('message', text); $('message').classList.toggle('error', error); }
async function api(action, params = {}, write = false) {
  if (localStorage.getItem('cedartoy_token') !== initialToken) { location.reload(); throw new Error('账号已切换，请重新读取'); }
  const query = new URLSearchParams({action, ...params});
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  let res, data;
  try {
    res = await fetch(write ? '/api/deeptalk/action' : '/api/deeptalk?' + query, {
      method:write ? 'POST' : 'GET', cache:'no-store', credentials:'omit', signal:controller.signal,
      headers:{Authorization:'Bearer ' + initialToken, ...(write ? {'Content-Type':'application/json'} : {})},
      ...(write ? {body:JSON.stringify({action, ...params})} : {})
    });
    data = await res.json();
  } catch (err) {
    if (err.name === 'AbortError' || err.name === 'TypeError') throw new Error('网络中断，请重试；当前输入仍保留在这里。');
    throw err;
  } finally { clearTimeout(timeout); }
  if (!res.ok) {
    if (res.status === 401) { $('login').hidden = false; $('round').hidden = $('setup').hidden = true; }
    const error = new Error(data.error || '请求失败，请重试'); error.status = res.status; throw error;
  }
  return data;
}
async function work(fn) {
  if (busy) return;
  busy = true; viewVersion++;
  const controls = [...document.querySelectorAll('button,select,textarea')];
  const wasDisabled = controls.map(el => el.disabled);
  controls.forEach(el => el.disabled = true);
  try { await fn(); } catch (err) {
    const text = err.message || '网络中断，请重试；当前输入仍保留在这里。';
    message(text, true);
    if ($('confirmDialog').open) $('confirmError').textContent = text;
  }
  finally { busy = false; controls.forEach((el, i) => el.disabled = wasDisabled[i]); updateControls(); }
}
function option(value, label) { const el = document.createElement('option'); el.value = value; el.textContent = label; return el; }
function isSubmitStep() {
  return !state.submitted && (index === state.total - 1 || state.questions.every(q => q.own));
}
function updateControls() {
  if (busy) return;
  if (context) $('create').disabled = !context.machines.length || !topic?.available;
  if (!state) return;
  const retainedDraft = state.submitted && dirty;
  $('previous').disabled = index === 0 || retainedDraft;
  $('next').disabled = (state.submitted && index >= state.total - 1) || retainedDraft;
  $('next').textContent = isSubmitStep() ? '提交答案' : '下一题';
  $('answer').disabled = false;
  $('answer').readOnly = state.submitted;
  $('questionJump').disabled = retainedDraft;
  $('newRound').hidden = state.submitted !== true;
}
function setupTopic() {
  $('topicTitle').textContent = topic.title;
  document.title = `${topic.title} · CEDAR TOY`;
  $('topicDescription').textContent = topic.total + '题 · ' + topic.description + (topic.available ? '' : ' · 题库尚未就绪');
  $('sources').open = false; $('sourceBody').replaceChildren(); updateControls();
}
function aiName() { return state.sharing_mode === 'bound_shared' ? '小机' : state.ai_name; }
function answerText(answer) { return answer ? answer.skipped ? '已跳过' : answer.text : '尚未回答'; }
function renderQuestion(preserveDraft = false) {
  const q = state.questions[index];
  $('questionJump').value = String(index);
  $('questionText').textContent = `${index + 1}. ${q.text}`;
  if (!preserveDraft) { $('answer').value = q.own?.text || ''; dirty = false; pendingAnswer = null; }
  const retainedDraft = state.submitted && dirty;
  $('answer').hidden = $('answerLabel').hidden = state.submitted && !retainedDraft;
  $('ownRead').hidden = !state.submitted || retainedDraft;
  $('ownRead').textContent = answerText(q.own);
  $('saveHint').textContent = retainedDraft ? '整卷已在另一页面提交。这里保留未提交的草稿供复制，不能再修改。' : state.submitted ? '整卷已提交，你的回答已锁定。' : q.own?.skipped && !dirty ? '这题已跳过，可补写。换题时自动保存。' : '换题时自动保存，留空则跳过。提交整卷前可修改。';
  renderPeer(); updateControls();
}
function renderPeer() {
  const visible = state.mode === 'chat' && !state.unlocked;
  $('peerAnswer').hidden = !visible;
  // Never place blind peer content in the hidden DOM.
  setText('peerText', visible ? answerText(state.questions[index].partner) : '');
}
function updateQuestionOptions() {
  $('questionJump').replaceChildren(...state.questions.map((q,i) => option(i, `第${i+1}题 · ${q.own ? q.own.skipped ? '—已跳过' : '✓已回答' : '○待回答'}`)));
  $('questionJump').value = String(index);
}
function renderProgress() {
  const visible = state.mode === 'chat';
  $('progress').hidden = !visible;
  setText('progress', visible ? `你 ${state.progress.human.done}/${state.total} · 小机 ${state.progress.ai.done}/${state.total}` : '');
}
function renderRound(preserveDraft = false) {
  $('setup').hidden = true; $('round').hidden = false; $('sources').hidden = false;
  $('roundDescription').textContent = state.total + '题 · ' + (state.description || '');
  $('newRound').href = '/deeptalk?topic_id=' + encodeURIComponent(state.topic_id);
  document.title = `${state.title} · CEDAR TOY`;
  $('roundTitle').textContent = state.title;
  renderProgress();
  $('peerAnswer').hidden = state.mode !== 'chat' || state.unlocked;
  $('editor').hidden = state.unlocked; $('records').hidden = !state.unlocked;
  if (state.unlocked) {
    $('records').replaceChildren();
    for (const q of state.questions) {
      const article = document.createElement('article'); article.className = 'record';
      const title = document.createElement('h3'); title.textContent = `${q.number}. ${q.text}`; article.append(title);
      const pair = document.createElement('div'); pair.className = 'answer-pair';
      for (const [name, answer] of [[state.human_name,q.own],[aiName(),q.partner]]) {
        const section = document.createElement('div'), label = document.createElement('b'), text = document.createElement('p');
        label.textContent = name; text.textContent = answerText(answer); section.append(label,text); pair.append(section);
      }
      article.append(pair); $('records').append(article);
    }
  } else {
    updateQuestionOptions();
    renderQuestion(preserveDraft);
  }
  updateControls();
}
async function loadRound(initial = false, preserveDraft = false) {
  viewVersion++;
  const fresh = await api('view',{round_id:roundId});
  if (preserveDraft && dirty && fresh.submitted) {
    state.submitted = true; state.progress = fresh.progress;
    renderProgress(); renderQuestion(true);
    throw new Error('整卷已在另一页面提交，当前草稿仍保留供复制。');
  }
  preserveDraft = preserveDraft && dirty;
  if (preserveDraft && JSON.stringify(state.questions[index].own) !== JSON.stringify(fresh.questions[index].own)) {
    if (!confirm('另一页面也修改了这题：\n' + answerText(fresh.questions[index].own) + '\n\n保留当前输入，继续修改这份回答？')) return false;
  }
  state = fresh; remoteChanged = false;
  if (initial) index = state.next_number - 1;
  renderRound(preserveDraft);
  return true;
}
// Read-only polling in both modes. A routine poll never replaces input, selection,
// scroll, revision or question options. Only a confirmed lock/unlock changes views.
async function pollPeer() {
  if (polling || busy || document.hidden || !state || state.unlocked || $('round').hidden) return;
  polling = true;
  const version = viewVersion, currentState = state, currentIndex = index;
  const current = () => !busy && version === viewVersion && state === currentState && index === currentIndex && !document.hidden;
  try {
    const fresh = await api('question', {round_id:roundId, number:currentIndex + 1});
    if (!current()) return;
    state.progress = fresh.progress;
    if (state.mode === 'chat') state.questions[index].partner = fresh.questions[0].partner;
    renderPeer(); renderProgress();
    remoteChanged = fresh.revision !== state.revision || fresh.submitted !== state.submitted;
    setText('liveHint', remoteChanged ? '回答已在另一页面更新，换题时会核对；当前输入已保留。' : '');
    if (fresh.submitted && dirty) {
      state.submitted = true;
      if ($('confirmDialog').open) $('confirmDialog').close();
      renderQuestion(true); return;
    }
    if ((fresh.submitted !== state.submitted || fresh.unlocked !== state.unlocked) && !dirty && !pendingAnswer) {
      const full = await api('view', {round_id:roundId});
      if (!current() || dirty || pendingAnswer) return;
      state = full; remoteChanged = false;
      if ($('confirmDialog').open) $('confirmDialog').close();
      renderRound(); $('liveHint').textContent = '';
    }
  } catch (err) {
    if (current()) {
      $('liveHint').textContent = '暂时无法同步进度，稍后自动重试；当前输入已保留。';
      if ([401,403,404].includes(err.status)) { $('round').hidden = true; state = null; message(err.message, true); }
    }
  } finally { polling = false; }
}
setInterval(pollPeer, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollPeer(); });
async function saveAnswer() {
  // An uncertain response must retry its original request before any reconciliation.
  if (remoteChanged && !pendingAnswer) {
    if (await loadRound(false, true) === false) throw new Error('未换题，当前输入已保留。');
  }
  if (state.submitted) return;
  const q = state.questions[index], text = $('answer').value, skip = !text.trim();
  if (!dirty && q.own && !pendingAnswer) return;
  const body = {round_id:roundId, question_id:q.id, revision:state.revision, ...(skip ? {skip:true} : {text})};
  const fingerprint = JSON.stringify(body);
  if (!pendingAnswer || pendingAnswer.fingerprint !== fingerprint) pendingAnswer = {fingerprint, body:{...body,request_id:key()}};
  let result;
  try { result = await api('answer',pendingAnswer.body,true); }
  catch (err) {
    if (err.status === 409) {
      remoteChanged = true; pendingAnswer = null;
      throw new Error('回答已在另一页面更新。当前输入已保留，再次换题可核对后重试。');
    }
    throw err;
  }
  // Replaying an acknowledged request may return a newer revision from another tab.
  // Do not pair that revision with our older cached answer and silently overwrite it.
  if (result.revision !== body.revision + 1 || result.submitted) {
    remoteChanged = true; pendingAnswer = null;
    throw new Error('回答已保存，但答卷随后在另一页面更新。当前输入已保留，再次换题可核对。');
  }
  state = {...state,...result}; q.own = skip ? {skipped:true} : {text,skipped:false};
  dirty = false; pendingAnswer = null; remoteChanged = false;
  updateQuestionOptions(); renderProgress(); message(''); $('liveHint').textContent = '';
}
async function move(next) {
  await saveAnswer();
  if (state.submitted && dirty) return;
  if (next >= state.total) {
    const missing = state.questions.findIndex(q => !q.own);
    if (missing < 0) { renderQuestion(); openSubmit(); return; }
    next = missing; message('还有未处理的题目，请作答或留空跳过。');
  }
  index = Math.max(0, next); renderQuestion(); $('questionText').focus();
}
function openSubmit() {
  if (state.submitted || dirty || state.questions.some(q => !q.own)) return;
  const skipped = state.questions.filter(q => q.own.skipped).length;
  $('confirmText').textContent = `共 ${state.total} 题，已回答 ${state.total - skipped} 题，已跳过 ${skipped} 题。提交后整卷锁定，不能再修改。` + (state.mode === 'blind' ? '双方都正式提交后，才会解锁双人回答。' : '');
  $('confirmError').textContent = '';
  $('confirmDialog').showModal();
}
$('mode').onchange = () => { $('modeIntro').textContent = $('mode').value === 'chat' ? '边聊边答：双方已作答的内容实时可见。' : '答完再看：双方答完后互相查看。'; };
$('create').onclick = () => work(async () => {
  const choice = {topic_id:topic.topic_id, mode:$('mode').value};
  const fingerprint = JSON.stringify(choice);
  if (!pendingCreate || pendingCreate.fingerprint !== fingerprint) pendingCreate = {fingerprint,body:{...choice,request_id:key()}};
  // Retain the exact request across a refresh after an uncertain network response.
  sessionStorage.setItem('deeptalk_pending_create',JSON.stringify(pendingCreate));
  const result = await api('create',pendingCreate.body,true);
  roundId = result.round_id; pendingCreate = null; sessionStorage.removeItem('deeptalk_pending_create');
  history.replaceState(null,'','/deeptalk?round_id=' + encodeURIComponent(roundId));
  $('sources').open = false; $('sourceBody').replaceChildren();
  await loadRound(true); message('');
});
$('answer').oninput = () => { dirty = true; updateControls(); $('saveHint').textContent = '换题时自动保存，留空则跳过。提交整卷前可修改。'; };
$('previous').onclick = () => work(() => move(index-1));
$('next').onclick = () => work(() => move(isSubmitStep() ? state.total : index+1));
$('questionJump').onchange = () => { const next = Number($('questionJump').value); $('questionJump').value = String(index); if (next !== index) work(() => move(next)); };
$('cancelSubmit').onclick = () => $('confirmDialog').close();
$('confirmSubmit').onclick = () => work(async () => {
  let result;
  try { result = await api('submit',{round_id:roundId,revision:state.revision,confirm:true},true); }
  catch (err) {
    if (err.status === 409) {
      $('confirmDialog').close(); await loadRound(false, true);
      throw new Error('答卷已在另一页面更新，请检查后重新确认提交。');
    }
    throw err;
  }
  // Lock immediately after the acknowledged write, even if the result read fails.
  state = {...state,...result,unlocked:false};
  $('confirmDialog').close(); renderRound(); message('整卷已正式提交。');
  if (result.unlocked) {
    try { await loadRound(); }
    catch (_) { $('liveHint').textContent = '答卷已锁定，暂时无法读取双人回答，稍后自动重试。'; }
  }
});
function sourceLink(label, url) {
  const text = document.createElement('span'); text.textContent = label;
  try {
    const parsed = new URL(url);
    if (!['https:', 'http:'].includes(parsed.protocol)) return text;
    const link = document.createElement('a'); link.textContent = label;
    link.href = parsed.href; link.target = '_blank'; link.rel = 'noopener noreferrer';
    return link;
  } catch (_) { return text; }
}
$('sources').ontoggle = () => { if ($('sources').open && !$('sourceBody').hasChildNodes()) work(async () => {
  const data = await api('source',state ? {round_id:roundId} : {topic_id:topic.topic_id});
  const title = document.createElement('p'); title.textContent = data.title; $('sourceBody').append(title);
  for (const entry of data.entries) {
    const section = document.createElement('div'); section.className = 'source-entry';
    const author = document.createElement('p'); author.textContent = '作者：' + entry.author;
    const license = document.createElement('p'); license.append('许可：', sourceLink(entry.license, entry.license_url));
    section.append(sourceLink(entry.name, entry.source_url), author, license); $('sourceBody').append(section);
  }
  const note = document.createElement('p'); note.className = 'hint'; note.textContent = data.note; $('sourceBody').append(note);
}); };
window.addEventListener('beforeunload', event => { if (dirty) { event.preventDefault(); event.returnValue = ''; } });
window.addEventListener('storage', event => {
  if (event.key === 'cedartoy_token') {
    dirty = false; state = null; $('round').hidden = true; $('records').replaceChildren(); $('answer').value = '';
    location.reload();
  }
});
work(async () => {
  if (!roundId && !requestedTopicId) { $('chooseTopic').hidden = false; message('请选择一套想聊的题库。'); return; }
  if (!initialToken) { $('login').hidden = false; message('登录后可以创建和继续轮次。'); return; }
  if (roundId) { await loadRound(true); message(''); return; }
  context = await api('context');
  topic = context.topics.find(t => t.topic_id === requestedTopicId);
  if (!topic) { $('chooseTopic').hidden = false; message('没有找到这套题库，请从首页重新进入。', true); return; }
  $('bindingHint').textContent = context.machines.length ? '已绑定的小机一起回答，共用一份答卷。' : '请先回首页绑定小机，再开始问答。';
  try { pendingCreate = JSON.parse(sessionStorage.getItem('deeptalk_pending_create')); } catch (_) { /* Ignore a damaged retry hint. */ }
  $('setup').hidden = false; $('sources').hidden = false; setupTopic(); message('已登录：' + context.username);
});
</script>
