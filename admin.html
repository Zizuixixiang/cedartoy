<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEDAR TOY 管理后台</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #f6f2ee;
      --panel: #fffdf9;
      --line: #ddd4ca;
      --text: #27231f;
      --muted: #746b62;
      --accent: #2f6f73;
      --accent-dark: #215155;
      --danger: #a33d3d;
      --warn: #a46b26;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select {
      font: inherit;
    }
    button, .button-link {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      min-height: 36px;
      padding: 7px 11px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    button.primary, .button-link.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.danger {
      background: #fff7f7;
      border-color: #e7b3b3;
      color: var(--danger);
    }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 38px;
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
    }
    .shell {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 36px;
      display: grid;
      gap: 14px;
    }
    .topbar, .toolbar, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .topbar {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }
    .sub {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .top-actions, .toolbar, .row-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar {
      padding: 10px;
    }
    .toolbar .count {
      margin-left: auto;
      color: var(--muted);
      font-size: 14px;
    }
    .pagination {
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pagination select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 6px 9px;
    }
    .search {
      width: min(360px, 100%);
    }
    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }
    .status.error {
      color: var(--danger);
    }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }
    th, td {
      border-bottom: 1px solid #eee5dc;
      padding: 10px 11px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
      line-height: 1.4;
    }
    th {
      background: #eee7df;
      font-size: 13px;
      color: #443c35;
      white-space: nowrap;
    }
    td {
      max-width: 220px;
      overflow-wrap: anywhere;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 8px;
      background: #edf4f4;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
    }
    .badge.warn {
      background: #fff1dc;
      color: var(--warn);
    }
    .badge.off {
      background: #f0ece8;
      color: var(--muted);
    }
    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }
    .admin-tabs {
      display: flex;
      gap: 6px;
      padding: 6px;
      background: #e9e2da;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .admin-tabs button {
      flex: 0 1 180px;
      background: transparent;
      border-color: transparent;
      font-weight: 700;
    }
    .admin-tabs button[aria-selected="true"] {
      background: var(--panel);
      border-color: var(--line);
      color: var(--accent-dark);
      box-shadow: 0 1px 3px rgba(39, 35, 31, .08);
    }
    .tab-panel[hidden] { display: none; }
    .tab-panel {
      display: grid;
      gap: 14px;
      min-width: 0;
    }
    .dashboard-toolbar {
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .dashboard-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .dashboard-control select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 9px;
      background: #fff;
      color: var(--text);
    }
    .last-refresh {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .dashboard-section {
      padding: 14px;
      display: grid;
      gap: 12px;
      min-width: 0;
    }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .section-head h2, .section-head h3, .subsection-head h3 {
      margin: 0;
      font-size: 19px;
    }
    .dashboard-subsection {
      display: grid;
      gap: 10px;
      min-width: 0;
    }
    .dashboard-subsection + .dashboard-subsection {
      padding-top: 12px;
      border-top: 1px solid #e8ded4;
    }
    .subsection-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .subsection-head h3 { font-size: 16px; }
    .section-note {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 155px), 1fr));
      gap: 9px;
      min-width: 0;
    }
    .dashboard-content {
      display: grid;
      gap: 12px;
      min-width: 0;
    }
    .metric-card {
      min-width: 0;
      padding: 12px;
      border: 1px solid #e8ded4;
      border-radius: 7px;
      background: #fff;
    }
    .metric-card .metric-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .metric-card .metric-value {
      margin-top: 5px;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 750;
      color: var(--accent-dark);
      overflow-wrap: anywhere;
    }
    .metric-card .metric-detail {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .module-error {
      border: 1px solid #e7b3b3;
      background: #fff7f7;
      color: var(--danger);
      border-radius: 7px;
      padding: 12px;
    }
    .dashboard-split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }
    .subpanel {
      min-width: 0;
      border: 1px solid #e8ded4;
      border-radius: 7px;
      background: #fff;
      padding: 11px;
    }
    .subpanel h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }
    .bar-list {
      display: grid;
      gap: 8px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(92px, 1fr) minmax(90px, 3fr) auto;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      min-width: 0;
    }
    .bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #eee7df;
    }
    .bar-fill {
      height: 100%;
      min-width: 2px;
      border-radius: inherit;
      background: var(--accent);
    }
    .bar-value {
      min-width: 22px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .aggregate-list {
      display: grid;
      gap: 7px;
    }
    .aggregate-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 8px 9px;
      border-radius: 6px;
      background: #f7f2ed;
    }
    .aggregate-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .aggregate-title, .aggregate-key {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .aggregate-title { font-size: 13px; }
    .aggregate-key {
      color: var(--muted);
      font-size: 11px;
    }
    .aggregate-value {
      color: var(--accent-dark);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .dashboard-empty {
      color: var(--muted);
      font-size: 13px;
      padding: 10px 0;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(39, 35, 31, .28);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 20;
    }
    .modal.show {
      display: flex;
    }
    .modal-box {
      width: min(520px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: var(--panel);
      border-radius: 8px;
      border: 1px solid var(--line);
      box-shadow: 0 18px 60px rgba(39, 35, 31, .24);
      padding: 16px;
      display: grid;
      gap: 13px;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-head h2 {
      margin: 0;
      font-size: 20px;
    }
    .form {
      display: grid;
      gap: 11px;
    }
    label {
      display: grid;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
    }
    .checks {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      background: #fff;
      font-weight: 600;
    }
    .check input {
      width: 18px;
      min-height: 18px;
    }
    .modal-actions {
      display: flex;
      justify-content: end;
      gap: 8px;
      flex-wrap: wrap;
    }
    @media (max-width: 760px) {
      .shell {
        width: min(calc(100vw - 16px), 1180px);
        padding: 8px 0 22px;
        gap: 10px;
      }
      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
      }
      h1 { font-size: 21px; }
      .sub { font-size: 12.5px; line-height: 1.4; }
      .top-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
        gap: 6px;
      }
      .top-actions > * {
        width: 100%;
        min-width: 0;
        min-height: 34px;
        padding: 6px 7px;
        overflow: hidden;
        font-size: 13px;
        text-overflow: ellipsis;
      }
      .toolbar { display: grid; grid-template-columns: 1fr 1fr; }
      .toolbar .search, .toolbar .count, .toolbar button { width: 100%; margin-left: 0; }
      .admin-tabs { gap: 4px; padding: 4px; }
      .admin-tabs button { flex: 1 1 0; min-width: 0; min-height: 34px; padding: 5px 7px; }
      .tab-panel { gap: 10px; }
      .dashboard-toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
        padding: 8px;
      }
      .dashboard-control {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 6px;
        min-width: 0;
      }
      .dashboard-control select { width: 100%; min-width: 0; min-height: 34px; }
      .dashboard-toolbar > button { width: auto; min-height: 34px; padding: 6px 9px; }
      .last-refresh {
        grid-column: 1 / -1;
        width: 100%;
        margin-left: 0;
        font-size: 12px;
        line-height: 1.4;
      }
      .dashboard-section { padding: 10px; gap: 9px; }
      .dashboard-content { gap: 9px; }
      .section-head, .subsection-head { gap: 4px 8px; }
      .section-head h2, .section-head h3 { font-size: 17px; }
      .subsection-head h3 { font-size: 15px; }
      .dashboard-subsection { gap: 7px; }
      .dashboard-subsection + .dashboard-subsection { padding-top: 9px; }
      .section-note { font-size: 12px; line-height: 1.4; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .metric-card { padding: 9px; }
      .metric-card .metric-label { font-size: 11.5px; }
      .metric-card .metric-value { margin-top: 4px; font-size: 20px; }
      .metric-card .metric-detail { margin-top: 4px; font-size: 11.5px; line-height: 1.35; }
      .dashboard-split { grid-template-columns: 1fr; }
      .subpanel { padding: 9px; }
      .subpanel h3 { margin-bottom: 8px; font-size: 14px; }
      .bar-list { gap: 6px; }
      .bar-row {
        grid-template-columns: minmax(0, 86px) minmax(42px, 1fr) auto;
        gap: 6px;
        font-size: 12px;
      }
      .aggregate-item { padding: 7px 8px; }
      .table-wrap { background: transparent; border: 0; overflow: visible; }
      table, tbody, tr, td { display: block; min-width: 0; width: 100%; }
      thead { display: none; }
      tbody { display: grid; gap: 10px; }
      tr { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; }
      td { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; max-width: none; padding: 8px 10px; }
      td::before { content: attr(data-label); color: var(--muted); font-weight: 700; }
      .row-actions button { flex: 1 1 auto; }
      .checks { grid-template-columns: 1fr; }
      .modal { align-items: end; padding: 10px; }
    }
    @media (max-width: 420px) {
      .shell { width: calc(100vw - 12px); }
      .topbar { padding: 10px; }
      .section-head .section-note, .subsection-head .section-note { width: 100%; }
      .metric-card .metric-value { font-size: 19px; }
      .bar-row { grid-template-columns: minmax(0, 78px) minmax(38px, 1fr) auto; }
    }
    @media (max-width: 370px) {
      .shell { width: calc(100vw - 8px); }
      .top-actions { grid-template-columns: .85fr 1.25fr .7fr; gap: 4px; }
      .top-actions > * { padding-inline: 4px; font-size: 12px; }
      .dashboard-section { padding: 8px; }
      .metric-card { padding: 8px; }
      .metric-card .metric-value { font-size: 18px; }
      .bar-row { grid-template-columns: minmax(0, 70px) minmax(34px, 1fr) auto; gap: 5px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>CEDAR TOY 管理后台</h1>
        <p class="sub">账号管理与聚合运营数据；不展示对话、题目答案或私人备注。</p>
      </div>
      <div class="top-actions">
        <a class="button-link" href="/">开始页</a>
        <a class="button-link" href="/soup/admin">海龟汤管理</a>
        <button id="logoutBtn" type="button">登出</button>
      </div>
    </header>

    <nav class="admin-tabs" aria-label="管理后台页面">
      <button id="usersTab" type="button" role="tab" aria-selected="true" aria-controls="usersPanel">用户管理</button>
      <button id="dashboardTab" type="button" role="tab" aria-selected="false" aria-controls="dashboardPanel">运营看板</button>
    </nav>

    <div class="tab-panel" id="usersPanel" role="tabpanel" aria-labelledby="usersTab">
      <section class="toolbar" aria-label="用户管理工具栏">
        <input class="search" id="searchInput" type="search" placeholder="搜索用户名 / 精确 ID">
        <button id="refreshBtn" type="button">刷新</button>
        <span class="count" id="countText">未加载</span>
      </section>

      <p class="status" id="statusText"></p>

      <section class="panel table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>用户名</th>
              <th>类型</th>
              <th>管理员</th>
              <th>状态</th>
              <th>海龟汤身份</th>
              <th>绑定</th>
              <th>创建时间</th>
              <th>活跃时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="userRows"></tbody>
        </table>
        <div class="empty" id="emptyState" hidden>暂无账号</div>
      </section>
      <nav class="panel pagination" aria-label="账号分页">
        <label for="pageSize">每页</label>
        <select id="pageSize">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
        <button id="prevPage" type="button">上一页</button>
        <span id="pageText">第 1 / 1 页</span>
        <button id="nextPage" type="button">下一页</button>
      </nav>
    </div>

    <div class="tab-panel" id="dashboardPanel" role="tabpanel" aria-labelledby="dashboardTab" hidden>
      <section class="panel dashboard-toolbar" aria-label="运营看板工具栏">
        <label class="dashboard-control" for="dashboardRange">
          统计范围
          <select id="dashboardRange">
            <option value="10m">10分钟</option>
            <option value="1h" selected>1小时</option>
            <option value="6h">6小时</option>
            <option value="12h">12小时</option>
            <option value="24h">24小时</option>
          </select>
        </label>
        <button id="dashboardRefreshBtn" type="button">立即刷新</button>
        <span class="last-refresh" id="dashboardLastRefresh">尚未刷新 · 看板可见时每30秒自动刷新</span>
      </section>

      <p class="status" id="dashboardStatus" aria-live="polite"></p>

      <section class="panel dashboard-section" id="duelDashboard" aria-labelledby="duelTitle">
        <div class="section-head">
          <h2 id="duelTitle">双弈</h2>
        </div>
        <div class="dashboard-subsection" aria-labelledby="duelActivityTitle">
          <div class="subsection-head">
            <h3 id="duelActivityTitle">双弈 · 所选范围活跃</h3>
            <span class="section-note" id="duelActivityRangeLabel"></span>
          </div>
          <div class="metric-grid" id="duelActivityMetrics"></div>
        </div>
        <div class="dashboard-subsection" aria-labelledby="duelRangeTitle">
          <div class="subsection-head">
            <h3 id="duelRangeTitle">双弈 · 所选范围统计</h3>
            <span class="section-note" id="duelRangeLabel"></span>
          </div>
          <div class="dashboard-content" id="duelContent"><div class="dashboard-empty">切换到运营看板后加载</div></div>
        </div>
        <div class="dashboard-subsection" aria-labelledby="chipsTitle">
          <div class="subsection-head">
            <h3 id="chipsTitle">筹码 / 互动</h3>
            <span class="section-note" id="chipsRangeLabel"></span>
          </div>
          <div class="dashboard-content" id="chipsContent"><div class="dashboard-empty">切换到运营看板后加载</div></div>
        </div>
      </section>

      <section class="panel dashboard-section" id="turtleDashboard" aria-labelledby="turtleTitle">
        <div class="section-head">
          <h2 id="turtleTitle">海龟汤</h2>
        </div>
        <div class="dashboard-subsection" aria-labelledby="turtleActivityTitle">
          <div class="subsection-head">
            <h3 id="turtleActivityTitle">海龟汤 · 所选范围活跃</h3>
            <span class="section-note" id="turtleActivityRangeLabel"></span>
          </div>
          <div class="metric-grid" id="turtleActivityMetrics"></div>
        </div>
        <div class="dashboard-subsection" aria-labelledby="turtleRangeTitle">
          <div class="subsection-head">
            <h3 id="turtleRangeTitle">海龟汤 · 所选范围统计</h3>
            <span class="section-note" id="turtleRangeLabel"></span>
          </div>
          <div class="dashboard-content" id="turtleContent"><div class="dashboard-empty">切换到运营看板后加载</div></div>
        </div>
      </section>
    </div>
  </main>

  <div class="modal" id="editModal">
    <div class="modal-box">
      <div class="modal-head">
        <h2>编辑账号</h2>
        <button type="button" data-close>关闭</button>
      </div>
      <div class="form">
        <label>
          用户名
          <input id="editUsername" maxlength="20">
        </label>
        <div class="checks">
          <label class="check"><input id="editIsAi" type="checkbox"> AI</label>
          <label class="check"><input id="editIsAdmin" type="checkbox"> 管理员</label>
          <label class="check"><input id="editDeleted" type="checkbox"> 旧管理停用</label>
        </div>
      </div>
      <p class="status error" id="editError"></p>
      <div class="modal-actions">
        <button type="button" data-close>取消</button>
        <button class="primary" id="saveEditBtn" type="button">保存</button>
      </div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "cedartoy_token";
    const USERNAME_RE = /^[a-zA-Z0-9_\u4e00-\u9fff]{2,20}$/;
    const $ = (id) => document.getElementById(id);
    let users = [];
    let editing = null;
    let currentPage = 1;
    let pageSize = 50;
    let totalUsers = 0;
    let searchQuery = "";
    let searchTimer = null;
    let usersLoaded = false;
    let activeTab = "users";
    let dashboardData = null;
    let dashboardLoading = false;
    let dashboardTimer = null;
    let dashboardLastLoadedAt = 0;
    const DASHBOARD_REFRESH_MS = 30000;
    const DUEL_GAME_LABELS = Object.freeze({
      tictactoe: "井字棋",
      gomoku: "五子棋",
      othello: "黑白棋",
      connect4: "四子连珠",
      dots_boxes: "点格棋",
      jungle: "斗兽棋",
      xiangqi: "象棋",
      checkers: "西洋跳棋",
      banqi: "翻翻棋",
      chess: "国际象棋",
      junqi: "军棋",
      go: "围棋",
      aeroplane_chess: "飞行棋",
      chinese_checkers: "中国跳棋",
      liars_dice: "吹牛骰子",
      yahtzee: "快艇骰子",
      uno: "UNO",
      blackjack: "21点",
      train_cards: "开火车",
      doudizhu: "斗地主",
      guandan: "掼蛋",
      gandengyan: "干瞪眼",
      zhajinhua: "炸金花",
      texas_holdem: "德州扑克",
      mahjong: "麻将",
    });

    function duelGameLabel(gameType) {
      return DUEL_GAME_LABELS[String(gameType || "")] || String(gameType || "未知游戏");
    }

    function token() {
      return localStorage.getItem(TOKEN_KEY) || "";
    }

    function headers(json = false) {
      return {
        ...(json ? {"Content-Type": "application/json"} : {}),
        ...(token() ? {Authorization: `Bearer ${token()}`} : {}),
      };
    }

    function setStatus(message, isError = false) {
      $("statusText").textContent = message || "";
      $("statusText").classList.toggle("error", Boolean(isError));
    }

    function apiError(data, fallback) {
      return data.error || data.detail || fallback || "请求失败";
    }

    async function request(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: {...headers(Boolean(options.body)), ...(options.headers || {})},
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if (res.status === 401) {
          localStorage.removeItem(TOKEN_KEY);
          throw new Error("请先在开始页登录管理员账号");
        }
        if (res.status === 403) throw new Error("当前账号没有管理员权限");
        throw new Error(apiError(data));
      }
      return data;
    }

    function boolBadge(value, yes, no) {
      return value ? `<span class="badge">${yes}</span>` : `<span class="badge off">${no}</span>`;
    }

    function statusBadge(user) {
      if (user.deletion_requested_at_epoch) {
        return `<span class="badge warn">待注销<br>${escapeHtml(formatEpoch(user.scheduled_delete_at_epoch))}</span>`;
      }
      return user.deleted_at
        ? `<span class="badge warn">旧管理停用</span>`
        : `<span class="badge">正常</span>`;
    }

    function formatEpoch(value) {
      if (!value) return "";
      return new Date(Number(value) * 1000).toLocaleString("zh-CN", {
        timeZone: "Asia/Shanghai", hour12: false,
      });
    }

    function clip(value) {
      const text = String(value ?? "");
      return text.length > 60 ? `${text.slice(0, 60)}...` : text;
    }

    function render() {
      const totalPages = Math.max(1, Math.ceil(totalUsers / pageSize));
      $("countText").textContent = `共 ${totalUsers} 个账号，本页 ${users.length} 个`;
      $("pageText").textContent = `第 ${currentPage} / ${totalPages} 页`;
      $("prevPage").disabled = currentPage <= 1;
      $("nextPage").disabled = currentPage >= totalPages;
      $("emptyState").hidden = users.length !== 0;
      $("userRows").innerHTML = users.map((user) => `
        <tr>
          <td data-label="ID">${user.id}</td>
          <td data-label="用户名" title="${escapeHtml(user.username)}">${escapeHtml(clip(user.username))}</td>
          <td data-label="类型">${boolBadge(user.is_ai, "AI", "人类")}</td>
          <td data-label="管理员">${boolBadge(user.is_admin, "是", "否")}</td>
          <td data-label="状态">${statusBadge(user)}</td>
          <td data-label="海龟汤身份">${user.soup_player_count || 0}</td>
          <td data-label="绑定">AI ${user.bound_ai_count || 0} / 人类 ${user.bound_human_count || 0} / 码 ${user.active_binding_tokens || 0}</td>
          <td data-label="创建时间">${escapeHtml(formatDbDateTime(user.created_at))}</td>
          <td data-label="活跃时间">${escapeHtml(formatDbDateTime(user.last_active_at))}</td>
          <td data-label="操作">
            <div class="row-actions">
              <button type="button" data-action="edit" data-id="${user.id}" ${user.deletion_requested_at_epoch ? "disabled" : ""}>编辑</button>
              
              <button type="button" data-action="reset-link" data-id="${user.id}" ${user.deletion_requested_at_epoch ? "disabled" : ""}>生成重置链接</button>
              <button class="danger" type="button" data-action="release" data-id="${user.id}">立即释放账号（高危）</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function formatDbDateTime(value) {
      if (!value) return "";
      const raw = String(value).trim();
      const normalized = raw.includes("T")
        ? (/[zZ]$/.test(raw) || /[+-]\d{2}:?\d{2}$/.test(raw) ? raw : `${raw}+08:00`)
        : `${raw.replace(" ", "T")}+08:00`;
      const date = new Date(normalized);
      if (Number.isNaN(date.getTime())) return raw;
      return date.toLocaleString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function setDashboardStatus(message, isError = false) {
      $("dashboardStatus").textContent = message || "";
      $("dashboardStatus").classList.toggle("error", Boolean(isError));
    }

    function number(value) {
      return new Intl.NumberFormat("zh-CN").format(Number(value || 0));
    }

    function decimal(value) {
      return new Intl.NumberFormat("zh-CN", {maximumFractionDigits: 1}).format(Number(value || 0));
    }

    function percent(value) {
      return `${decimal(Number(value || 0) * 100)}%`;
    }

    function formatApiDateTime(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString("zh-CN", {hour12: false});
    }

    function metricCard(label, value, detail = "") {
      return `
        <div class="metric-card">
          <div class="metric-label">${escapeHtml(label)}</div>
          <div class="metric-value">${escapeHtml(value)}</div>
          ${detail ? `<div class="metric-detail">${escapeHtml(detail)}</div>` : ""}
        </div>
      `;
    }

    function barList(items, labelKey, valueKey, emptyText = "暂无数据") {
      if (!items || !items.length) return `<div class="dashboard-empty">${escapeHtml(emptyText)}</div>`;
      const max = Math.max(...items.map((item) => Number(item[valueKey] || 0)), 1);
      return `<div class="bar-list">${items.map((item) => {
        const value = Number(item[valueKey] || 0);
        return `
          <div class="bar-row" title="${escapeHtml(item[labelKey])}: ${number(value)}">
            <span class="bar-label">${escapeHtml(item[labelKey])}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${Math.max(0, value / max * 100)}%"></span></span>
            <span class="bar-value">${number(value)}</span>
          </div>
        `;
      }).join("")}</div>`;
    }

    function statusBars(counts, labels) {
      return barList(Object.entries(counts || {}).map(([key, value]) => ({
        label: labels[key] || key,
        value,
      })), "label", "value");
    }

    function renderDuel(data, rangeLabel) {
      const activity = data?.realtime || {};
      $("duelActivityRangeLabel").textContent = rangeLabel;
      $("duelActivityMetrics").innerHTML = [
        metricCard("活跃房间", data?.ok ? number(activity.active_rooms) : "—", data?.ok ? "所选时段有活动且仍在进行或等待" : "模块暂时不可用"),
        metricCard("活跃人类", data?.ok ? number(activity.active_humans) : "—", "活跃房间内实际加入的人类"),
        metricCard("活跃小机", data?.ok ? number(activity.active_bound_machines) : "—", "活跃房间内实际加入的绑定小机"),
        metricCard("NPC 活跃桌", data?.ok ? number(activity.active_npc_rooms) : "—", "活跃房间内的系统 NPC"),
      ].join("");
      $("duelRangeLabel").textContent = rangeLabel;
      if (!data || !data.ok) {
        $("duelContent").innerHTML = `<div class="module-error">${escapeHtml(data?.error || "双弈数据暂时不可用")}</div>`;
        return;
      }
      const summary = data.range || {};
      const participants = summary.participants || {};
      const npc = data.npc || {};
      $("duelContent").innerHTML = `
        <div class="metric-grid">
          ${metricCard("新开房", number(summary.new_rooms))}
          ${metricCard("真正开始过", number(summary.started_rooms), "有实际对局动作或已经结束")}
          ${metricCard("完成房", number(summary.completed_rooms), "在所选时间内完成")}
          ${metricCard("参与人类", number(participants.human), "开始房内去重")}
          ${metricCard("参与小机", number(participants.bound_machine), "不含系统 NPC")}
          ${metricCard("NPC 房间", number(npc.rooms), `占开始房 ${percent(npc.started_room_share)}`)}
        </div>
        <div class="dashboard-split">
          <div class="subpanel">
            <h3>实际开始游戏分布</h3>
            ${barList((summary.game_distribution || []).map((item) => ({...item, game_label: duelGameLabel(item.game_type)})), "game_label", "rooms")}
          </div>
          <div class="subpanel">
            <h3>NPC 使用</h3>
            <div class="metric-grid">
              ${metricCard("NPC 参与次数", number(npc.participant_occurrences), "按每桌实际参与记录统计")}
              ${metricCard("不同 NPC 角色", number(npc.distinct_personas))}
            </div>
          </div>
        </div>
      `;
    }

    function renderTurtle(data, rangeLabel) {
      const activity = data?.realtime || {};
      $("turtleActivityRangeLabel").textContent = rangeLabel;
      $("turtleActivityMetrics").innerHTML = [
        metricCard("活跃房间", data?.ok ? number(activity.active_rooms) : "—", "仍未结束且在所选时段有活动"),
        metricCard("活跃人类", data?.ok ? number(activity.active_humans) : "—", "有在场或游戏操作记录的人类"),
        metricCard("活跃小机", data?.ok ? number(activity.active_ai) : "—", "有在场或游戏操作记录的小机"),
      ].join("");
      $("turtleRangeLabel").textContent = rangeLabel;
      if (!data || !data.ok) {
        $("turtleContent").innerHTML = `<div class="module-error">${escapeHtml(data?.error || "海龟汤数据暂时不可用")}</div>`;
        return;
      }
      const summary = data.range || {};
      const participants = summary.participants || {};
      const duration = summary.finished_duration_minutes || {};
      $("turtleContent").innerHTML = `
        <div class="metric-grid">
          ${metricCard("新开房", number(summary.new_rooms))}
          ${metricCard("完成房", number(summary.completed_rooms), "在所选时间内完成")}
          ${metricCard("答出", number(summary.solved_rooms), "有胜者记录")}
          ${metricCard("提问次数", number(summary.question_count), "所选时间内提交的问题")}
          ${metricCard("无胜者结束", number(summary.ended_without_winner))}
          ${metricCard("参与人类", number(participants.human), "按直接活动证据去重")}
          ${metricCard("参与小机", number(participants.ai), "按参与者类型区分")}
          ${metricCard("完成平均时长", `${decimal(duration.average)} 分钟`, `样本 ${number(duration.sample)}`)}
          ${metricCard("完成中位时长", `${decimal(duration.median)} 分钟`)}
        </div>
        <div class="subpanel">
          <h3>新开房当前状态</h3>
          ${barList(summary.status_distribution, "status", "rooms")}
        </div>
      `;
    }

    function renderChips(duel, rangeLabel) {
      $("chipsRangeLabel").textContent = rangeLabel;
      if (!duel || !duel.ok) {
        $("chipsContent").innerHTML = `<div class="module-error">${escapeHtml(duel?.error || "筹码与互动数据暂时不可用")}</div>`;
        return;
      }
      const chips = duel.chips || {};
      const checkIns = chips.daily_check_ins || {};
      const checksByType = checkIns.by_subject_type || {};
      const settlements = chips.settlements || {};
      const settlementPeople = settlements.participants || {};
      const exchange = chips.exchange || {};
      const loans = chips.loans || {};
      const achievements = chips.achievements || {};
      const exchangeLabels = {completed: "已完成", pending: "待处理", withdrawn: "已撤回", rejected: "已拒绝", expired: "已过期"};
      const loanLabels = {negotiating: "协商中", active: "进行中", overdue: "逾期", repaid: "已还清", rejected: "已拒绝", withdrawn: "已撤回", expired: "已过期"};
      const itemRows = (exchange.items || []).map((item) => `
        <div class="aggregate-item" title="${escapeHtml(item.item_title)} · ${escapeHtml(item.item_key)}">
          <span class="aggregate-copy">
            <span class="aggregate-title">${escapeHtml(item.item_title)}</span>
            <span class="aggregate-key">${escapeHtml(item.item_key)}</span>
          </span>
          <strong class="aggregate-value">${number(item.requests)}</strong>
        </div>
      `).join("");
      $("chipsContent").innerHTML = `
        <div class="metric-grid">
          ${metricCard("每日签到", number(checkIns.count), `去重主体 ${number(checkIns.distinct_subjects)} · 人 ${number(checksByType.human?.count)} / 机 ${number(checksByType.ai?.count)}`)}
          ${metricCard("筹码结算房", number(settlements.rooms), `人 ${number(settlementPeople.human)} / 机 ${number(settlementPeople.bound_machine)}`)}
          ${metricCard("结算下注总量", number(settlements.total_stake), `每桌下注中位数 ${decimal(settlements.median_stake)}`)}
          ${metricCard("互动商店请求", number(exchange.requests), `不同人机组合 ${number(exchange.distinct_pairs)}`)}
          ${metricCard("新建借款", number(loans.created), `成交 ${number(loans.accepted)} · 还清 ${number(loans.repaid)}`)}
          ${metricCard("成就自动解锁", number(achievements.unlocks), `覆盖 ${number(achievements.distinct_subjects)} · 奖励 ${number(achievements.reward_chips)}`)}
        </div>
        <div class="dashboard-split">
          <div class="subpanel">
            <h3>互动请求状态</h3>
            ${statusBars(exchange.status_counts, exchangeLabels)}
          </div>
          <div class="subpanel">
            <h3>借款状态</h3>
            ${statusBars(loans.status_counts, loanLabels)}
          </div>
        </div>
        <div class="subpanel">
          <h3>互动商品（最多10项）</h3>
          ${itemRows ? `<div class="aggregate-list">${itemRows}</div>` : `<div class="dashboard-empty">该范围暂无互动请求</div>`}
        </div>
      `;
    }

    function renderDashboard(data) {
      const rangeLabel = `${data.range?.label || "所选范围"} · ${formatApiDateTime(data.range?.start_at)} 至 ${formatApiDateTime(data.range?.end_at)}`;
      renderDuel(data.duel, rangeLabel);
      renderTurtle(data.turtle, rangeLabel);
      renderChips(data.duel, rangeLabel);
    }

    async function loadDashboard({silent = false} = {}) {
      if (dashboardLoading) return;
      if (!token()) {
        setDashboardStatus("请先在开始页登录管理员账号", true);
        return;
      }
      dashboardLoading = true;
      $("dashboardRefreshBtn").disabled = true;
      if (!silent) setDashboardStatus("看板加载中...");
      const requestedRange = $("dashboardRange").value;
      try {
        const data = await request(`/api/admin/activity?range=${encodeURIComponent(requestedRange)}`);
        dashboardData = data;
        dashboardLastLoadedAt = Date.now();
        renderDashboard(data);
        $("dashboardLastRefresh").textContent = `最后刷新：${formatApiDateTime(data.generated_at)} · 看板可见时每30秒自动刷新`;
        const moduleErrors = [data.duel, data.turtle].filter((module) => module && !module.ok).map((module) => module.error);
        setDashboardStatus(moduleErrors.length ? `部分数据不可用：${moduleErrors.join("；")}` : "", moduleErrors.length > 0);
      } catch (err) {
        const suffix = dashboardData ? "；已保留上次成功数据" : "";
        setDashboardStatus(`刷新失败：${err.message}${suffix}`, true);
      } finally {
        dashboardLoading = false;
        $("dashboardRefreshBtn").disabled = false;
        if (activeTab === "dashboard" && $("dashboardRange").value !== requestedRange) {
          loadDashboard();
        }
      }
    }

    function updateDashboardTimer() {
      if (dashboardTimer) clearInterval(dashboardTimer);
      dashboardTimer = null;
      if (activeTab !== "dashboard" || document.hidden) return;
      dashboardTimer = setInterval(() => {
        if (activeTab === "dashboard" && !document.hidden) loadDashboard({silent: true});
      }, DASHBOARD_REFRESH_MS);
    }

    function switchTab(tab) {
      activeTab = tab === "dashboard" ? "dashboard" : "users";
      const dashboardActive = activeTab === "dashboard";
      $("usersPanel").hidden = dashboardActive;
      $("dashboardPanel").hidden = !dashboardActive;
      $("usersTab").setAttribute("aria-selected", String(!dashboardActive));
      $("dashboardTab").setAttribute("aria-selected", String(dashboardActive));
      history.replaceState(null, "", dashboardActive ? "#dashboard" : "#users");
      if (dashboardActive) {
        if (!dashboardData || Date.now() - dashboardLastLoadedAt >= DASHBOARD_REFRESH_MS) loadDashboard();
      } else if (!usersLoaded) {
        loadUsers();
      }
      updateDashboardTimer();
    }

    async function loadUsers() {
      if (!token()) {
        setStatus("请先在开始页登录管理员账号", true);
        $("countText").textContent = "未登录";
        return;
      }
      setStatus("加载中...");
      try {
        const params = new URLSearchParams({
          page: String(currentPage),
          page_size: String(pageSize),
        });
        if (searchQuery) params.set("search", searchQuery);
        const data = await request(`/api/admin/users?${params}`);
        users = data.users || [];
        totalUsers = Number(data.total || 0);
        currentPage = Number(data.page || currentPage);
        pageSize = Number(data.page_size || pageSize);
        const totalPages = Math.max(1, Math.ceil(totalUsers / pageSize));
        if (currentPage > totalPages) {
          currentPage = totalPages;
          return loadUsers();
        }
        render();
        usersLoaded = true;
        setStatus("");
      } catch (err) {
        users = [];
        totalUsers = 0;
        render();
        setStatus(err.message, true);
      }
    }

    function openEdit(user) {
      editing = user;
      $("editUsername").value = user.username || "";
      $("editIsAi").checked = Boolean(user.is_ai);
      $("editIsAdmin").checked = Boolean(user.is_admin);
      $("editDeleted").checked = Boolean(user.deleted_at);
      $("editError").textContent = "";
      $("editModal").classList.add("show");
    }

    function closeModal() {
      editing = null;
      $("editModal").classList.remove("show");
    }

    async function saveEdit() {
      if (!editing) return;
      const username = $("editUsername").value.trim();
      if (!USERNAME_RE.test(username)) {
        $("editError").textContent = "用户名须为 2-20 位中文、字母、数字或下划线";
        return;
      }
      try {
        await request(`/api/admin/users/${editing.id}`, {
          method: "PUT",
          body: JSON.stringify({
            username,
            is_ai: $("editIsAi").checked ? 1 : 0,
            is_admin: $("editIsAdmin").checked ? 1 : 0,
            deleted: $("editDeleted").checked ? 1 : 0,
          }),
        });
        closeModal();
        await loadUsers();
      } catch (err) {
        $("editError").textContent = err.message;
      }
    }

    async function resetPassword(user) {
      const password = prompt(`给「${user.username}」设置新密码，至少 6 位`);
      if (password === null) return;
      if (password.length < 6) {
        alert("密码至少 6 位");
        return;
      }
      try {
        await request(`/api/admin/users/${user.id}/reset-password`, {
          method: "POST",
          body: JSON.stringify({password}),
        });
        setStatus(`已重置「${user.username}」的密码`);
        await loadUsers();
      } catch (err) {
        setStatus(err.message, true);
      }
    }

    async function generateResetLink(user) {
      try {
        const data = await request("/api/admin/generate-reset-link", {
          method: "POST",
          body: JSON.stringify({user_id: user.id}),
        });
        try { await navigator.clipboard.writeText(data.reset_url); } catch (e) {}
        prompt(`「${user.username}」的重置链接（1 小时内有效，已复制）`, data.reset_url);
        setStatus(`已为「${user.username}」生成密码重置链接并复制`);
      } catch (err) {
        setStatus(err.message, true);
      }
    }

    async function releaseUser(user) {
      const ok = confirm(`确认立即释放账号「${user.username}」？\n\n此管理员高危动作会跳过 72 小时冷静期，永久删除认证信息和私人存档；多人历史只做匿名化。不可恢复。`);
      if (!ok) return;
      try {
        await request(`/api/admin/users/${user.id}`, {method: "DELETE"});
        setStatus(`已立即清理并释放「${user.username}」`);
        await loadUsers();
      } catch (err) {
        setStatus(err.message, true);
      }
    }

    $("refreshBtn").addEventListener("click", loadUsers);
    $("usersTab").addEventListener("click", () => switchTab("users"));
    $("dashboardTab").addEventListener("click", () => switchTab("dashboard"));
    $("dashboardRefreshBtn").addEventListener("click", () => loadDashboard());
    $("dashboardRange").addEventListener("change", () => loadDashboard());
    $("searchInput").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery = $("searchInput").value.trim();
        currentPage = 1;
        loadUsers();
      }, 250);
    });
    $("pageSize").addEventListener("change", () => {
      pageSize = Number($("pageSize").value);
      currentPage = 1;
      loadUsers();
    });
    $("prevPage").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage -= 1;
        loadUsers();
      }
    });
    $("nextPage").addEventListener("click", () => {
      if (currentPage * pageSize < totalUsers) {
        currentPage += 1;
        loadUsers();
      }
    });
    $("saveEditBtn").addEventListener("click", saveEdit);
    $("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem("cedartoy_user_id");
      location.href = "/";
    });
    document.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", closeModal));
    $("editModal").addEventListener("click", (event) => {
      if (event.target.id === "editModal") closeModal();
    });
    $("userRows").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const user = users.find((item) => String(item.id) === button.dataset.id);
      if (!user) return;
      if (button.dataset.action === "edit") openEdit(user);
      if (button.dataset.action === "reset") resetPassword(user);
      if (button.dataset.action === "reset-link") generateResetLink(user);
      if (button.dataset.action === "release") releaseUser(user);
    });
    document.addEventListener("visibilitychange", () => {
      updateDashboardTimer();
      if (
        activeTab === "dashboard"
        && !document.hidden
        && Date.now() - dashboardLastLoadedAt >= DASHBOARD_REFRESH_MS
      ) loadDashboard({silent: Boolean(dashboardData)});
    });

    switchTab(location.hash === "#dashboard" ? "dashboard" : "users");
  </script>
</body>
</html>
