<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CEDAR TOY · TEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #FDF6F7;
      --purple: #BEB1D1;
      --purple-dark: #9B8DB5;
      --purple-darker: #8678A0;
      --purple-light: #E6DFF0;
      --pink: #E6A8B1;
      --pink-dark: #C28B93;
      --text: #5C5463;
      --muted: #9CA3AF;
      --card: #FFFFFF;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html { min-height: 100%; background: var(--bg); image-rendering: pixelated; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(190, 177, 209, .1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(190, 177, 209, .1) 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, a { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    .pixel, h1, h2, .eyebrow, .progress-label, .mode-code, .status-text {
      font-family: "Silkscreen", "Microsoft YaHei", sans-serif;
    }
    .topbar {
      min-height: 60px;
      padding: 10px clamp(14px, 4vw, 30px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: #fff;
      background: var(--purple);
      border-bottom: 4px solid var(--purple-dark);
    }
    .brand, .back-link { color: #fff; text-decoration: none; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: clamp(17px, 4vw, 24px); }
    .pixel-logo { width: 22px; height: 16px; border: 4px solid #fff; box-shadow: 8px 8px 0 -4px #fff; }
    .back-link { font-size: 12px; padding: 8px; border: 2px solid rgba(255,255,255,.7); }
    main { width: min(920px, calc(100% - 28px)); margin: 0 auto; padding: clamp(24px, 5vw, 48px) 0 calc(40px + var(--safe-bottom)); }
    .hero { margin-bottom: 22px; }
    .eyebrow { color: var(--pink-dark); font-size: 11px; letter-spacing: .08em; }
    h1 { margin: 7px 0 6px; color: var(--purple-darker); font-size: clamp(26px, 7vw, 46px); line-height: 1.15; }
    .hero p { margin: 0; color: var(--muted); font-size: 14px; }
    .question-intro.page-disclaimer { margin: 14px 0 0; font-size: 12px; }
    #source { overflow-wrap: anywhere; }
    .page-disclaimer[hidden] { display: none; }
    .hero .research-notice { margin-top: 10px; color: var(--text); font-size: 12px; line-height: 1.65; }
    .research-details, .research-help { color: var(--text); font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
    .research-details summary { width: fit-content; min-height: 44px; padding: 12px 0; cursor: pointer; }
    .research-meta { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 8px 12px; margin: 0; padding: 12px 0; border-top: 2px solid var(--purple-light); text-align: left; }
    .research-meta dt { font-weight: 700; }
    .research-meta dd { min-width: 0; margin: 0; }
    .research-meta a, .research-result a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .research-result { overflow-wrap: anywhere; }
    .research-result .research-notice { margin: 0 0 16px; font-size: 12px; line-height: 1.65; }
    .research-scores { margin: 0; }
    .research-score { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 2px solid var(--purple-light); }
    .research-score:first-child { padding-top: 0; }
    .research-score dt { font-size: 14px; line-height: 1.65; }
    .research-score dd { margin: 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .research-score-maximum { color: var(--muted); font-size: 15px; font-weight: 600; }
    .research-score-range { display: block; color: var(--muted); font-size: 12px; font-weight: 400; line-height: 1.5; }
    .research-result .research-help { margin-top: 16px; }
    .rbi-interpretation { margin-top: 22px; font-size: 14px; line-height: 1.8; }
    .rbi-interpretation h3, .rbi-interpretation h4 { margin: 0 0 6px; font-size: 14px; }
    .rbi-interpretation h4 { margin-top: 16px; }
    .rbi-interpretation p { margin: 0; }
    .rbi-interpretation .research-help { margin: 0 0 16px; }
    .research-interpretation { margin-top: 26px; padding-top: 21px; border-top: 2px solid var(--purple-light); font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
    .research-interpretation h3 { margin: 0 0 10px; color: var(--purple-darker); font-size: 15px; }
    .research-interpretation .research-summary { margin: 0; }
    .research-interpretation .research-dimensions { margin-top: 23px; }
    .research-interpretation .research-dimension { margin-top: 15px; padding: 0 0 13px; border-bottom: 1px solid var(--purple-light); }
    .research-interpretation .research-dimension:last-child { border-bottom: 0; padding-bottom: 0; }
    .research-interpretation .research-dimension h4 { margin: 0 0 5px; font-size: 14px; color: var(--text); }
    .research-interpretation .research-dimension p { margin: 0; }
    .research-interpretation .research-actions { margin-top: 22px; }
    .research-interpretation .research-actions ol { margin: 0; padding-left: 22px; }
    .research-interpretation .research-actions li { margin: 0 0 10px; padding-left: 2px; }
    .research-help { margin: 12px 0 0; }
    .research-help a { color: inherit; }
    .research-page #questionIntro { color: var(--text); font-size: 13px; }
    .research-page .question-actions { flex-wrap: wrap; }
    .research-page .question-actions button { color: var(--text); font-size: 12px; min-height: 44px; }
    .research-page .answer-button { min-height: 44px; padding: 8px 12px; font-size: 14px; }
    .research-page .answer-button.selected, .research-page .scale-step.selected { color: var(--text); }
    .mbti-scale-ends.research-scale-ends { gap: 16px; align-items: start; font-family: inherit; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .research-scale-ends span { flex: 1; min-width: 0; }
    .research-scale-ends span:last-child { text-align: right; }
    .research-scale-middle { margin: 0 0 7px; text-align: center; font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .research-scale-selection { min-height: 1.65em; margin: 12px 0 0; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
    .research-scale-key { margin-top: 4px; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
    .research-scale-key summary { width: fit-content; min-height: 44px; padding: 12px 0; cursor: pointer; }
    .research-scale-key p { margin: 0 0 4px; }
    .mbti-scale-track.research-scale-track { grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); row-gap: 2px; }
    .research-scale-track .scale-step { color: var(--text); font-size: 13px; }
    .research-scale-track .scale-step:focus-visible { outline-offset: -3px; }
    .research-page button:focus-visible, .research-page summary:focus-visible, .research-page a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    .shell {
      position: relative;
      min-height: 430px;
      padding: clamp(18px, 4vw, 34px);
      background: var(--card);
      border: 4px solid var(--purple);
      box-shadow: 10px 10px 0 var(--purple-light);
    }
    .shell::before { content: ""; position: absolute; top: -4px; left: 26px; width: 54px; border-top: 4px solid var(--pink); }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 26px; }
    .status-text { color: var(--purple-dark); font-size: 11px; }
    .identity { color: var(--muted); font-size: 12px; text-align: right; }
    .panel[hidden] { display: none; }
    .intro { max-width: 660px; }
    h2 { margin: 0 0 10px; color: var(--purple-darker); font-size: clamp(18px, 4vw, 26px); }
    .lead { margin: 0 0 24px; line-height: 1.8; color: #716978; }
    .modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .mode-button {
      min-height: 105px;
      padding: 16px;
      text-align: left;
      color: var(--text);
      background: #fff;
      border: 3px solid var(--purple-light);
      box-shadow: 5px 5px 0 rgba(190,177,209,.28);
    }
    .mode-button:hover, .mode-button:focus-visible { outline: 0; border-color: var(--pink); transform: translateY(-2px); }
    .mode-code { display: block; margin-bottom: 9px; color: var(--purple-darker); font-size: 12px; }
    .mode-desc { font-size: 13px; line-height: 1.5; color: var(--muted); }
    .progress-wrap { margin-bottom: 28px; }
    .progress-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
    .progress-label { font-size: 11px; color: var(--purple-dark); }
    .progress-track { height: 12px; padding: 2px; border: 2px solid var(--purple); background: #fff; }
    .progress-fill { display: block; width: 0; height: 100%; background: var(--pink); transition: width .18s ease; }
    .question-number { margin-bottom: 8px; color: var(--pink-dark); font-size: 12px; }
    .question-intro { margin: 0 0 18px; padding: 12px; color: var(--muted); background: var(--bg); border-left: 4px solid var(--pink); line-height: 1.65; }
    .question-intro[hidden] { display: none; }
    .question-text { margin: 0 0 22px; font-size: clamp(18px, 4vw, 25px); line-height: 1.55; color: var(--text); }
    .mbti-poles { display: grid; grid-template-columns: 1fr; gap: 10px 18px; margin-bottom: 18px; padding: 3px 0 9px; border-bottom: 2px dashed var(--purple-light); }
    .pole { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: start; gap: 6px; padding: 2px 0; line-height: 1.5; background: transparent; border: 0; cursor: default; }
    .pole b { padding-top: 2px; color: var(--purple-darker); font-family: "Silkscreen", sans-serif; font-size: 11px; line-height: 1.35; }
    .pole:last-child b { color: var(--pink-dark); }
    .pole span { color: var(--text); font-size: 13px; }
    .answers { display: grid; gap: 10px; }
    .answers.mbti { display: block; }
    .mbti-scale-ends {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      color: var(--purple-darker);
      font-family: "Silkscreen", sans-serif;
      font-size: 16px;
    }
    .mbti-scale-direction { color: var(--muted); font-size: 9px; letter-spacing: .08em; }
    .mbti-scale-track {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      overflow: hidden;
      background: linear-gradient(90deg, var(--purple-light), #FFF7F8);
      border: 3px solid var(--purple);
      box-shadow: 5px 5px 0 rgba(190,177,209,.28);
    }
    .ecr-scale-ends {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      font-family: inherit;
      font-size: clamp(10px, 2.8vw, 13px);
      white-space: nowrap;
    }
    .ecr-scale-ends span:nth-child(2) { text-align: center; }
    .ecr-scale-ends span:last-child { text-align: right; }
    .ecr-scale-track { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .ecr-scale-track .scale-step { padding-inline: 0; }
    .ecr-neutral { display: block; margin-top: 1px; font-size: 9px; line-height: 1; white-space: nowrap; }
    .scale-step {
      position: relative;
      min-width: 0;
      min-height: 48px;
      padding: 5px 2px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-right: 2px solid rgba(155,141,181,.38);
      font-size: 11px;
      text-align: center;
    }
    .scale-step:last-child { border-right: 0; }
    .scale-step::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 3px;
      height: 9px;
      background: var(--purple-dark);
      transform: translateX(-50%);
    }
    .scale-step:hover, .scale-step:focus-visible { outline: 0; color: var(--purple-darker); background: rgba(255,255,255,.72); }
    .scale-step.selected {
      color: #fff;
      background: var(--pink);
      box-shadow: inset 0 -5px 0 var(--pink-dark);
    }
    .scale-step.selected::before { background: #fff; }
    .scale-degree { display: block; padding-top: 8px; white-space: nowrap; }
    .answer-button {
      min-height: 58px;
      padding: 12px;
      color: var(--text);
      background: #fff;
      border: 3px solid var(--purple-light);
      text-align: left;
      line-height: 1.45;
    }
    .answers.mbti .answer-button { text-align: center; font-size: 12px; padding: 9px 4px; }
    .answer-button:hover, .answer-button:focus-visible { outline: 0; border-color: var(--pink); background: #FFF7F8; }
    .answer-button.selected { color: var(--purple-darker); border-color: var(--pink); background: #FFF0F2; box-shadow: inset 4px 0 0 var(--pink); }
    button:disabled { cursor: wait; opacity: .55; }
    .result-screen {
      padding: clamp(18px, 4vw, 28px);
      color: var(--text);
      background: #fff;
      border: 4px solid var(--purple);
      box-shadow: 8px 8px 0 var(--purple-light);
    }
    .result-text { margin: 0; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border-left: 5px solid var(--pink); font-size: 14px; line-height: 1.75; }
    .result-text[hidden], .result-structured[hidden] { display: none; }
    .result-hero { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 3px solid var(--purple-light); text-align: center; }
    .result-primary { margin: 0; color: var(--purple-darker); font-family: "Silkscreen", "Microsoft YaHei", sans-serif; font-size: clamp(34px, 9vw, 58px); font-weight: 700; line-height: 1.05; }
    .result-primary.dnd-name { font-family: "Microsoft YaHei", sans-serif; font-size: clamp(30px, 8vw, 48px); font-weight: 800; }
    .result-secondary { margin: 8px 0 0; color: var(--pink-dark); font-family: "Silkscreen", "Microsoft YaHei", sans-serif; font-size: clamp(11px, 3vw, 15px); }
    .result-nickname { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
    .result-section { margin-top: 26px; }
    .result-section h3 { margin: 0 0 11px; color: var(--purple-darker); font-family: "Silkscreen", "Microsoft YaHei", sans-serif; font-size: 14px; }
    .result-section p { margin: 0 0 12px; line-height: 1.8; }
    .result-copy-paragraph { white-space: pre-line; }
    .result-list { margin: 0; padding-left: 22px; }
    .result-list li { margin: 0 0 10px; line-height: 1.75; }
    .glossary-card {
      position: relative;
      margin-top: 28px;
      padding: 20px 16px 14px;
      background: var(--bg);
      border: 3px solid var(--purple);
      box-shadow: 5px 5px 0 var(--purple-light);
    }
    .glossary-card::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 18px;
      width: 46px;
      border-top: 3px solid var(--pink);
    }
    .glossary-title {
      margin: 0 0 14px;
      color: var(--purple-darker);
      font-family: "Silkscreen", "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }
    .glossary-entry { margin: 0 0 12px; line-height: 1.75; }
    .glossary-entry:last-child { margin-bottom: 0; }
    .glossary-term { color: var(--pink-dark); font-weight: 800; }
    .axis-list { display: grid; gap: 15px; }
    .axis-card { padding: 12px; background: var(--bg); border: 2px solid var(--purple-light); }
    .axis-labels { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; color: var(--purple-darker); font-family: "Silkscreen", "Microsoft YaHei", sans-serif; font-size: 11px; }
    .axis-track { position: relative; height: 16px; background: linear-gradient(90deg, var(--purple-light), #fff 50%, #FBECEF); border: 2px solid var(--purple); }
    .axis-track::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 2px dotted rgba(155,141,181,.55); }
    .axis-cursor { position: absolute; z-index: 1; top: -7px; width: 8px; height: 26px; background: var(--pink); border: 2px solid var(--pink-dark); transform: translateX(-50%); }
    .result-footnote { margin: 28px 0 0; padding-top: 12px; color: var(--muted); border-top: 2px dashed var(--purple-light); font-size: 10px; line-height: 1.6; overflow-wrap: anywhere; }
    .metric-bars { display: grid; gap: 14px; }
    .metric-bar-row { min-width: 0; }
    .metric-bar-labels { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 10px; margin-bottom: 7px; }
    .metric-bar-name { min-width: 0; color: var(--purple-darker); font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
    .metric-bar-value { color: var(--pink-dark); font-family: "Silkscreen", "Microsoft YaHei", sans-serif; font-size: 12px; white-space: nowrap; }
    .metric-bar-track { height: 16px; overflow: hidden; background: var(--bg); border: 2px solid var(--purple-light); }
    .metric-bar-fill { height: 100%; min-width: 0; background: linear-gradient(90deg, var(--purple), var(--pink)); transition: width .45s ease; }
    .metric-bars-large .metric-bar-track { height: 26px; border-color: var(--purple); }
    .metric-bars-large .metric-bar-name, .metric-bars-large .metric-bar-value { font-size: 14px; }
    .metric-bars-compact { gap: 8px; margin-top: 12px; }
    .metric-bars-compact .metric-bar-labels { gap: 6px; margin-bottom: 4px; }
    .metric-bars-compact .metric-bar-name, .metric-bars-compact .metric-bar-value { font-size: 9px; }
    .metric-bars-compact .metric-bar-track { height: 10px; border-width: 1px; }
    .metric-bar-fill.humanity-certified-carbon { background: linear-gradient(90deg, #BD82A7, var(--pink)); }
    .metric-bar-fill.humanity-human-flavor { background: linear-gradient(90deg, var(--purple), #C78CAC); }
    .metric-bar-fill.humanity-mixed-signal { background: linear-gradient(90deg, var(--purple-dark), var(--purple)); }
    .metric-bar-fill.humanity-cyber-infiltration { background: linear-gradient(90deg, var(--purple-darker), var(--purple-dark)); }
    .metric-bar-fill.humanity-check-cooling { background: linear-gradient(90deg, #4F4661, #80758F); }
    .sins-virtues-legend { display: flex; justify-content: center; gap: 18px; margin-bottom: 12px; color: var(--muted); font-size: 11px; }
    .sins-virtues-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .sins-virtues-swatch { width: 15px; height: 9px; background: var(--purple-light); border: 2px solid var(--purple-darker); }
    .sins-virtues-swatch.virtue { background: var(--bg); border-color: var(--pink-dark); }
    .sins-virtues-radar-shell { width: min(100%, 520px); margin: 0 auto; }
    .sins-virtues-radar { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1.08; }
    .metric-bar-fill.sins-virtues-sin { background: var(--purple-darker); }
    .metric-bar-fill.sins-virtues-virtue { background: var(--pink); }
    .sins-virtues-scale-note { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 9px; }
    .compare-box { margin-top: 24px; padding: 16px; background: var(--bg); border: 2px dashed var(--purple); }
    .compare-box h3 { margin: 0 0 10px; color: var(--purple-darker); font-size: 14px; }
    .compare-form { display: flex; flex-wrap: wrap; gap: 10px; }
    .compare-form input { flex: 1 1 220px; min-width: 0; padding: 10px 12px; color: var(--text); background: #fff; border: 3px solid var(--purple-light); }
    .aidep-sharing { font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
    .aidep-sharing label { display: block; margin-bottom: 8px; color: var(--purple-darker); font-size: 14px; font-weight: 700; }
    .aidep-sharing p { margin: 8px 0; }
    .aidep-sharing .share-help { color: var(--muted); font-size: 12px; }
    .aidep-sharing select { flex: 1 1 220px; width: 100%; min-width: 0; min-height: 44px; padding: 8px; border: 3px solid var(--purple-light); background: #fff; color: var(--text); font-size: 13px; }
    .aidep-sharing button { min-height: 44px; font-size: 12px; }
    .aidep-sharing :focus-visible { outline: 2px solid var(--purple-darker); outline-offset: 3px; }
    .aidep-sharing pre { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; }
    .compare-people { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .compare-person { padding: 14px; background: var(--bg); border: 2px solid var(--purple-light); overflow-wrap: anywhere; }
    .compare-person h3 { margin: 0 0 9px; color: var(--purple-darker); font-size: 13px; }
    .compare-score-line { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .compare-emphasis-line { margin: 7px 0 0; color: var(--purple-darker); font-size: 14px; font-weight: 700; line-height: 1.55; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
    .pixel-button {
      min-height: 43px;
      padding: 9px 16px;
      color: #fff;
      background: var(--pink);
      border: 0;
      border-right: 4px solid var(--pink-dark);
      border-bottom: 4px solid var(--pink-dark);
      text-decoration: none;
    }
    .pixel-button.secondary { color: var(--purple-darker); background: #fff; border: 3px solid var(--purple); box-shadow: 4px 4px 0 var(--purple-light); }
    .question-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }
    .review-confirm { margin: clamp(34px, 8vw, 70px) 0; color: var(--purple-darker); font-size: clamp(18px, 4vw, 25px); font-weight: 700; text-align: center; }
    .review-actions { display: flex; flex-wrap: nowrap; justify-content: space-between; gap: clamp(6px, 2vw, 12px); }
    .review-actions .pixel-button { flex: 1 1 0; min-width: 0; padding-inline: clamp(5px, 2vw, 16px); white-space: nowrap; font-size: clamp(9px, 2.5vw, 12px); }
    .source { margin: 24px 0 0; color: var(--muted); text-align: center; font-size: 12px; }
    .source a { color: var(--purple-darker); }
    .entertainment-badge { width: fit-content; margin: 10px 0 0 auto; color: var(--purple-darker); border: 2px solid var(--purple); padding: 4px 8px; font-size: 9px; letter-spacing: .12em; }
    .loading { display: grid; min-height: 260px; place-items: center; color: var(--purple-dark); text-align: center; }
    .error { margin: 0 0 16px; padding: 12px; color: #9d4f5b; background: #FFF0F2; border-left: 5px solid var(--pink); line-height: 1.5; }
    .error[hidden] { display: none; }
    @media (max-width: 680px) {
      .topbar { min-height: 56px; }
      .brand { font-size: 16px; }
      .back-link { font-size: 10px; }
      main { width: min(100% - 20px, 920px); padding-top: 22px; }
      .shell { min-height: 470px; padding: 18px 14px; box-shadow: 6px 6px 0 var(--purple-light); }
      .status-row { align-items: flex-start; margin-bottom: 21px; }
      .identity { max-width: 56%; font-size: 10px; overflow-wrap: anywhere; }
      .modes { grid-template-columns: 1fr; }
      .mbti-poles { grid-template-columns: 1fr; gap: 7px; }
      .answer-button { min-height: 54px; }
      .scale-step { min-height: 48px; font-size: 10px; }
      .mbti-scale-direction { font-size: 8px; }
      .ecr-scale-ends { gap: 2px; font-size: 10px; }
      .ecr-scale-track { overflow: hidden; }
      .ecr-scale-track .scale-step { min-width: 0; border-right-width: 1px; }
      .result-screen { padding: 16px 12px; box-shadow: 5px 5px 0 var(--purple-light); }
      .axis-card { padding: 10px 8px; }
      .compare-people { grid-template-columns: 1fr; }
      .sins-virtues-legend { gap: 10px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand pixel" href="/?tab=test"><span class="pixel-logo" aria-hidden="true"></span>CEDAR TOY</a>
    <a class="back-link pixel" href="/?tab=test">← ARCADE</a>
  </header>
  <main>
    <section class="hero">
      <div class="eyebrow" id="subtitle"></div>
      <h1 id="title"></h1>
      <p>人类网页端 · 进度保留 24 小时</p>
      <p class="question-intro page-disclaimer" id="pageDisclaimer" hidden></p>
      <details class="research-details" id="researchDetails" hidden>
        <summary>来源与许可</summary>
      </details>
    </section>
    <section class="shell" aria-live="polite">
      <div class="status-row">
        <span class="status-text" id="statusText">SYSTEM / CONNECTING</span>
        <span class="identity" id="identity"></span>
      </div>
      <p class="error" id="error" hidden></p>
      <p class="research-help" id="draftNotice" hidden></p>

      <div class="panel loading" id="loadingPanel"><span class="pixel">LOADING SAVE...</span></div>

      <div class="panel intro" id="modePanel" hidden>
        <h2>选择测试模式</h2>
        <p class="lead">答案只保存在这台设备，全部答完并确认后才会一次提交。刷新页面可以继续，也可以随时返回修改。</p>
        <div class="modes" id="modes"></div>
      </div>

      <div class="panel" id="questionPanel" hidden>
        <p class="question-intro" id="questionIntro" hidden></p>
        <div class="progress-wrap">
          <div class="progress-head"><span class="progress-label" id="modeLabel"></span><span class="progress-label" id="progressLabel"></span></div>
          <div class="progress-track"><span class="progress-fill" id="progressFill"></span></div>
        </div>
        <div class="question-number" id="questionNumber"></div>
        <h2 class="question-text" id="questionText"></h2>
        <div class="mbti-poles" id="mbtiPoles" hidden></div>
        <div class="answers" id="answers"></div>
        <div class="question-actions">
          <button class="pixel-button secondary pixel" id="previousButton" type="button">← 上一题</button>
          <button class="pixel-button pixel" id="saveAnswerButton" type="button" hidden>下一题</button>
          <button class="pixel-button secondary pixel" id="reviewButton" type="button" hidden>查看答题卡 →</button>
        </div>
      </div>

      <div class="panel" id="reviewPanel" hidden>
        <h2>确认提交</h2>
        <p class="review-confirm" id="reviewSummary"></p>
        <div class="actions review-actions">
          <button class="pixel-button secondary pixel" id="modifyButton" type="button">← 返回修改</button>
          <button class="pixel-button pixel" id="submitButton" type="button">提交并查看结果 →</button>
        </div>
      </div>

      <div class="panel" id="resultPanel" hidden>
        <h2>测试结果</h2>
        <div class="result-screen">
          <div class="result-structured" id="resultStructured"></div>
          <p class="result-text" id="resultText" hidden></p>
        </div>
        <div class="actions">
          <button class="pixel-button pixel" id="restartButton" type="button">RETEST →</button>
          <a class="pixel-button secondary pixel" href="/?tab=test">BACK TO ARCADE</a>
        </div>
        <div class="compare-box" id="compareBox" hidden>
          <h3>双人对测</h3>
          <p>输入对方用户名或账号 id；游客可输入 guest: 开头的 id。无需授权，游客与账号同权。</p>
          <div class="compare-form">
            <input id="comparePlayerId" type="text" maxlength="70" placeholder="对方用户名或账号 id" autocomplete="off">
            <button class="pixel-button pixel" id="compareButton" type="button">COMPARE →</button>
          </div>
        </div>
      </div>
    </section>
    <p class="source" id="source"></p>
    <p class="entertainment-badge">仅供娱乐</p>
  </main>
  <script>
    const CONFIG = __TEST_GAME_CONFIG__;
    const hasModes = ["mbti", "enneagram"].includes(CONFIG.game);
    const TOKEN_KEY = "cedartoy_token";
    const GUEST_KEY = "cedartoy_guest_web_player_id";
    const panels = ["loadingPanel", "modePanel", "questionPanel", "reviewPanel", "resultPanel"];
    let activeState = null;
    let answers = [];
    let cursor = 0;
    let busy = false;
    let restartSessionId = null;
    let resultRadarCleanup = null;

    const $ = (id) => document.getElementById(id);
    // Presentation only: keep CONFIG and the backend's result/notice untouched.
    const displayTitle = CONFIG.display_title || CONFIG.title;
    document.title = `${displayTitle} · CEDAR TOY`;
    $("title").textContent = displayTitle;
    $("subtitle").textContent = CONFIG.subtitle;
    if (CONFIG.research) {
      document.body.classList.add("research-page");
      $("pageDisclaimer").className = "research-notice";
      $("pageDisclaimer").textContent = researchNotice();
      $("pageDisclaimer").hidden = false;
      $("researchDetails").hidden = false;
      renderResearchSource();
    } else {
      $("pageDisclaimer").textContent = CONFIG.disclaimer || "";
      $("pageDisclaimer").hidden = !CONFIG.disclaimer;
    }
    if (CONFIG.game === "enneagram") {
      $("source").textContent = "题库来自 kcdjmaxx/enneagram-llm-evaluator · ";
      const sourceLink = document.createElement("a");
      sourceLink.href = "https://github.com/kcdjmaxx/enneagram-llm-evaluator";
      sourceLink.target = "_blank";
      sourceLink.rel = "noopener noreferrer";
      sourceLink.textContent = "GitHub";
      $("source").append(sourceLink, "（MIT），感谢原作者。");
    } else if (!CONFIG.research) {
      $("source").textContent = CONFIG.source;
    }

    function researchNotice() {
      if (["rbi", "irrc", "jrrs", "ross", "rss", "ppts", "bsfl"].includes(CONFIG.game)) {
        return "非官方评分，仅供娱乐参考。";
      }
      if (CONFIG.game === "bsr") return "题目经改编，仅供娱乐参考。";
      if (CONFIG.game === "aidep") return "仅供人类，按原量表计分，仅供娱乐参考。";
      return "按原量表计分，仅供娱乐参考。";
    }

    function researchAttribution() {
      // human_configs supplies author · paper URL · license for all 18 scales.
      // Preserve the full author and license wording, including reuse restrictions.
      const [author, url, ...license] = (CONFIG.source || "").split(" · ");
      return {author, url, license: license.join(" · ")};
    }

    function renderResearchSource() {
      const source = researchAttribution();
      const list = makeResultElement("dl", "research-meta");
      list.id = "source";
      function row(label, text) {
        const value = document.createElement("dd");
        setResearchLinkedText(value, text);
        list.append(makeResultElement("dt", "", label), value);
        return value;
      }
      row("作者", source.author);
      row("原文", source.url);
      const license = row("许可", source.license);
      // Link the license name, keeping qualifiers (e.g. noncommercial) visible.
      for (const link of license.querySelectorAll("a")) {
        const prefix = link.previousSibling;
        const label = prefix?.textContent.match(/CC BY(?:-NC)? \d\.\d\s*(?:—\s*)?$/);
        if (label) {
          prefix.textContent = prefix.textContent.slice(0, label.index);
          link.textContent = label[0].replace(/\s*—?\s*$/, "");
        }
      }
      // These registry entries name the license without embedding its URL.
      if (!license.querySelector("a")) {
        const url = CONFIG.game.startsWith("ipip_") ? "https://ipip.ori.org/"
          : CONFIG.game === "mesx" ? "https://creativecommons.org/licenses/by/4.0/" : null;
        if (url) {
          setResearchLinkedText(license, url);
          license.querySelector("a").textContent = source.license;
        }
      }
      row(CONFIG.game === "bsr" ? "改编" : "翻译", CONFIG.game === "aidep"
        ? "由论文英文题目回译，未经验证。"
        : CONFIG.game === "bsr" ? "生成句为未验证中译；格言替换为古典短句。"
        : "中文题目为未验证翻译。");
      $("source").replaceWith(list);
      $("researchDetails").appendChild(list);
    }

    function setResearchLinkedText(node, text = "") {
      // Keep attribution verbatim; only http(s) URLs become links, never HTML.
      node.replaceChildren();
      let offset = 0;
      for (const match of text.matchAll(/https?:\/\/[^\s<>"'（）【】；，。]+/g)) {
        node.append(text.slice(offset, match.index));
        const link = document.createElement("a");
        link.href = match[0];
        link.textContent = match[0];
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        node.append(link);
        offset = match.index + match[0].length;
      }
      node.append(text.slice(offset));
    }

    function token() { return localStorage.getItem(TOKEN_KEY) || ""; }
    function guestPlayerId() {
      let value = localStorage.getItem(GUEST_KEY) || "";
      if (/^guest:web[a-zA-Z0-9]{1,61}$/.test(value)) return value;
      let suffix = "";
      if (globalThis.crypto?.getRandomValues) {
        const bytes = new Uint8Array(12);
        crypto.getRandomValues(bytes);
        suffix = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
      } else {
        suffix = `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`.replace(/[^a-zA-Z0-9]/g, "");
      }
      value = `guest:web${suffix}`;
      localStorage.setItem(GUEST_KEY, value);
      return value;
    }
    function identityBody(extra = {}) { return {player_id: guestPlayerId(), ...extra}; }
    function requestHeaders() {
      const headers = {"Content-Type": "application/json"};
      if (token()) headers.Authorization = `Bearer ${token()}`;
      return headers;
    }
    function draftKey(playerId = activeState?.player_id || guestPlayerId()) {
      return `cedartoy_${CONFIG.game}_web_draft_${playerId}`;
    }

    function showPanel(id) {
      panels.forEach((panelId) => { $(panelId).hidden = panelId !== id; });
    }
    function showError(message = "") {
      $("error").textContent = message;
      $("error").hidden = !message;
    }
    function setIdentity(data) {
      const shareable = CONFIG.game === "love" || CONFIG.game === "ecr";
      const label = data.identity === "account"
        ? `ACCOUNT #${data.player_id}`
        : (shareable ? `GUEST / ${data.player_id}` : "GUEST / LOCAL SAVE");
      $("identity").textContent = label;
    }
    function setButtonsDisabled(disabled) {
      document.querySelectorAll("button").forEach((button) => {
        if (!button.closest(".aidep-sharing")) button.disabled = disabled;
      });
    }

    async function api(action, payload = {}, retryGuest = true, signal) {
      if (CONFIG.research && action === "answer_batch") payload = {...payload, session_id: activeState.session_id};
      const response = await fetch(`/api/${CONFIG.game}/${action}`, {
        method: "POST",
        headers: requestHeaders(),
        body: JSON.stringify(identityBody(payload)),
        cache: "no-store",
        signal
      });
      const data = await response.json().catch(error => {
        if (signal?.aborted) throw error;
        return {};
      });
      if (response.status === 401 && token() && retryGuest) {
        // A research write must not be replayed under a different identity.
        if (CONFIG.research) throw new Error("登录已失效，请重新登录后刷新；当前答案仍保留在本机。");
        localStorage.removeItem(TOKEN_KEY);
        return api(action, payload, false);
      }
      if (!response.ok) {
        const error = new Error(data.error || "请求失败，请稍后重试");
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function renderModes() {
      $("aidepSharing")?.remove();
      activeState = null;
      answers = [];
      cursor = 0;
      $("statusText").textContent = "SYSTEM / SELECT MODE";
      $("modes").innerHTML = "";
      const modeItems = CONFIG.game === "enneagram"
        ? [
            {edition: "quick", label: "快速型 · 36题 A/B", desc: "快速查看主型与脑、心、腹三中心相对分"},
            {edition: "complete", label: "完整型 · 180题", desc: "完整计算主型、侧翼、三中心与 tritype 推测"}
          ]
        : [
            {edition: "quick", label: "快速版 · 16题", desc: "用较短时间完成一次人格偏好扫描"},
            {edition: "complete", label: "完整版 · 93题", desc: "更细致地覆盖四组人格偏好维度"}
          ];
      modeItems.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "mode-button";
        const code = document.createElement("span");
        code.className = "mode-code";
        code.textContent = item.label;
        const desc = document.createElement("span");
        desc.className = "mode-desc";
        desc.textContent = item.desc;
        button.append(code, desc);
        button.addEventListener("click", () => start(item.edition, true));
        $("modes").appendChild(button);
      });
      showPanel("modePanel");
    }

    function restoreDraft(state, pendingDraft) {
      answers = Array(state.total).fill(null);
      cursor = 0;
      let saved;
      try {
        saved = pendingDraft || JSON.parse(localStorage.getItem(currentDraftKey()) || (CONFIG.research ? localStorage.getItem(draftKey()) : null) || "null");
        if ((!saved?.game || saved.game === CONFIG.game) && saved?.edition === state.edition && (!CONFIG.research || saved.session_id === state.session_id) && saved.total === state.total && Array.isArray(saved.answers)) {
          answers = Array.from({length: state.total}, (_, index) => Number.isInteger(saved.answers[index]) ? saved.answers[index] : null);
          cursor = Math.max(0, Math.min(Number(saved.cursor) || 0, state.total - 1));
        }
      } catch (_) {}
      if (CONFIG.research && state.mode === "full") {
        let conflict = false;
        const base = saved?.base_answers;
        answers = answers.map((local, index) => {
          const remote = state.saved_answers[index] ?? null;
          const previous = Array.isArray(base) ? (base[index] ?? null) : null;
          if (local === remote || local === null || (Array.isArray(base) && local === previous)) return remote;
          if (remote === previous) return local;
          conflict = true;
          return remote;
        });
        if (conflict) {
          const raw = localStorage.getItem(currentDraftKey()) || localStorage.getItem(draftKey());
          localStorage.setItem(`${currentDraftKey()}_conflict_${Date.now()}`, raw);
          showOtherDrafts();
          showError("答案已在其他页面更新，已载入最新选择；本机冲突草稿已保留。");
        }
        cursor = Math.min(saved?.session_id === state.session_id ? cursor : state.progress, state.total - 1, state.progress);
      }
    }
    function currentDraftKey() {
      return CONFIG.research ? `${draftKey()}_session_${activeState.session_id}` : draftKey();
    }
    function showOtherDrafts() {
      if (!CONFIG.research) return;
      const drafts = {};
      const base = draftKey();
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key !== base && !key.startsWith(`${base}_session_`)) continue;
        const raw = localStorage.getItem(key);
        try {
          const saved = JSON.parse(raw);
          if (!key.includes("_conflict_") && saved?.session_id === activeState.session_id && saved.edition === activeState.edition && saved.total === activeState.total && Array.isArray(saved.answers)) continue;
        } catch (_) {}
        drafts[key] = raw;
      }
      const notice = $("draftNotice");
      notice.replaceChildren();
      notice.hidden = !Object.keys(drafts).length;
      if (notice.hidden) return;
      notice.append("另有旧草稿保留在本机，与当前记录不同，未覆盖或合并。");
      const link = document.createElement("a");
      link.textContent = "下载核对";
      link.download = `${CONFIG.game}-drafts.json`;
      link.href = `data:application/json;charset=utf-8,${encodeURIComponent(JSON.stringify(drafts, null, 2))}`;
      notice.append(link);
    }
    function draftSnapshot() {
      return {
        game: CONFIG.game,
        session_id: activeState.session_id,
        edition: activeState.edition,
        total: activeState.total,
        answers: [...answers],
        ...(CONFIG.research && activeState.mode === "full" ? {base_answers: activeState.saved_answers} : {}),
        cursor
      };
    }
    function saveDraft() {
      if (!activeState) return;
      localStorage.setItem(currentDraftKey(), JSON.stringify(draftSnapshot()));
    }
    function clearDraft() {
      // Research drafts may contain choices never acknowledged by the server.
      // Keep them by run instead of deleting them when a result/retest arrives.
      if (activeState && !CONFIG.research) localStorage.removeItem(draftKey());
      answers = [];
      cursor = 0;
    }

    function scrollToResultPanel() {
      const panel = $("resultPanel");
      if (!panel) return;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          panel.scrollIntoView({behavior: "smooth", block: "start"});
        });
      });
    }

    function renderState(state, pendingDraft) {
      $("aidepSharing")?.remove();
      activeState = state;
      restartSessionId = null;
      setIdentity(state);
      showOtherDrafts();
      if (state.complete) {
        clearDraft();
        $("statusText").textContent = "SYSTEM / SCAN COMPLETE";
        renderResult(state.result_data, state.result || "结果已生成。");
        $("compareBox").hidden = !(CONFIG.game === "love" || CONFIG.game === "ecr");
        showPanel("resultPanel");
        if (CONFIG.game === "aidep" && state.identity === "account" && token()) mountAidepSharing(state);
        scrollToResultPanel();
        return;
      }
      restoreDraft(state, pendingDraft);
      $("statusText").textContent = CONFIG.research && state.mode === "full" ? "SYSTEM / SAVED PROGRESS" : "SYSTEM / LOCAL SAVE";
      renderQuestion();
      showPanel("questionPanel");
    }

    function mountAidepSharing(state) {
      const section = makeResultElement("section", "compare-box aidep-sharing");
      section.id = "aidepSharing";
      const label = makeResultElement("label", "", "允许绑定的小机查看本次结果");
      label.htmlFor = "aidepShareTarget";
      const help = makeResultElement("p", "share-help", "默认仅自己可见。仅分享总体与四维分数及说明，不分享22道答案。重测后需重新授权；关闭后小机不能再次读取，已读到的内容无法收回。");
      const form = makeResultElement("div", "compare-form");
      const select = document.createElement("select");
      select.id = "aidepShareTarget";
      const save = makeResultElement("button", "pixel-button secondary", "保存选择");
      save.type = "button";
      const status = makeResultElement("p", "", "正在读取分享设置…");
      status.setAttribute("role", "status");
      const retry = makeResultElement("button", "pixel-button secondary", "刷新分享设置");
      retry.type = "button";
      retry.hidden = true;
      const example = makeResultElement("pre", "");
      const copy = makeResultElement("button", "pixel-button secondary", "复制给小机的查看指令");
      copy.type = "button";
      example.hidden = copy.hidden = true;
      select.disabled = save.disabled = true;
      form.append(select, save);
      section.append(label, help, form, status, retry, example, copy);
      $("resultPanel").querySelector(".actions").before(section);
      let settings = null;
      let savedStatus = "";
      const originalToken = token();
      const current = () => section.isConnected && activeState === state && token() === originalToken;
      const lock = (value) => { select.disabled = save.disabled = retry.disabled = value; };
      async function request(change) {
        if (!originalToken || token() !== originalToken) throw new Error("登录身份已变化，请刷新结果页");
        const response = await fetch("/api/aidep/sharing", {
          method: change ? "POST" : "GET", cache: "no-store",
          headers: {"Content-Type": "application/json", Authorization: `Bearer ${originalToken}`},
          ...(change ? {body: JSON.stringify(change)} : {})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "分享设置请求失败");
        if (data.session_id !== state.session_id) throw new Error("结果已变化，请刷新结果页后重新授权");
        return data;
      }
      function display(data) {
        settings = data;
        select.replaceChildren();
        const off = makeResultElement("option", "", "关闭 · 仅自己可见");
        off.value = "";
        select.appendChild(off);
        data.bindings.forEach((binding) => {
          const option = makeResultElement("option", "", binding.username);
          option.value = String(binding.ai_id);
          select.appendChild(option);
        });
        select.value = data.enabled ? String(data.ai_id) : "";
        const target = data.bindings.find(b => b.ai_id === data.ai_id);
        status.textContent = data.enabled ? `已授权：${target.username} · 仅本次结果` : "当前：仅自己可见";
        if (!data.bindings.length) status.textContent += "。暂无已绑定的小机，可在首页账号设置中绑定后刷新。";
        savedStatus = status.textContent;
        retry.hidden = data.bindings.length > 0;
        example.textContent = data.example;
        example.hidden = true;
        copy.hidden = !data.enabled;
        copy.textContent = "复制给小机的查看指令";
      }
      async function load() {
        lock(true);
        try {
          const data = await request();
          if (current()) { display(data); lock(false); }
        } catch (error) {
          if (current()) {
            settings = null;
            status.textContent = `无法确认当前分享状态：${error.message}`;
            example.hidden = copy.hidden = true;
            retry.hidden = false;
            retry.disabled = false;
          }
        }
      }
      select.addEventListener("change", () => {
        status.textContent = `${savedStatus}。选择尚未保存；点击「保存选择」后生效。`;
      });
      save.addEventListener("click", async () => {
        if (!settings) return;
        lock(true);
        status.textContent = "正在保存…";
        try {
          const data = await request({enabled: select.value !== "", ai_id: Number(select.value),
            session_id: state.session_id, result_version: settings.result_version});
          if (current()) { display(data); lock(false); }
        } catch (error) {
          if (current()) {
            settings = null;
            status.textContent = `保存未确认：${error.message}。请刷新分享设置核对。`;
            example.hidden = copy.hidden = true;
            retry.hidden = false;
            retry.disabled = false;
          }
        }
      });
      retry.addEventListener("click", load);
      copy.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(example.textContent); copy.textContent = "已复制"; }
        catch (_) { example.hidden = false; copy.textContent = "请选中上方指令复制"; }
      });
      load();
    }

    function renderQuestion() {
      const question = activeState.questions[cursor];
      if (!question) return;
      const sequential = CONFIG.research && activeState.mode === "full";
      const answeredCount = CONFIG.research && activeState.mode === "full" ? activeState.progress : answers.filter(Number.isInteger).length;
      $("modeLabel").textContent = CONFIG.research
        ? "全题作答"

        ? (activeState.edition === "quick" ? "快速版 · 16题" : "完整版 · 93题")
        : CONFIG.game === "enneagram"
        ? (activeState.edition === "quick" ? "快速型 · 36题 A/B" : "完整型 · 180题")
        : ({dnd: "九阵营 · 36题", love: "爱之语 · 30题", ecr: "依恋类型 · 36题", humanity: "人类浓度 · 20题", sins_virtues: "七宗罪 VS 七美德 · 35题"}[CONFIG.game] || "测试");
      $("progressLabel").textContent = `${cursor + 1} / ${activeState.total}`;
      $("progressFill").style.width = `${Math.max(2, answeredCount / activeState.total * 100)}%`;
      $("questionNumber").textContent = `QUESTION ${question.number}`;

      if (CONFIG.game === "mbti") {

        $("mbtiPoles").children[1].querySelector("span").textContent = question.option_b;

      } else if (CONFIG.game === "ecr") {
        $("mbtiPoles").hidden = true;

      } else if (CONFIG.game === "enneagram") {
        $("mbtiPoles").hidden = true;
        if (activeState.edition === "quick") {
          $("answers").className = "answers";
          question.options.forEach((option) => {
            addAnswer(option.value, `${option.label || option.value} · ${option.text}`);
          });
        } else {
          $("answers").className = "answers mbti ecr";
          renderEnneagramScale(question);
        }
      } else if (CONFIG.research) {
        $("mbtiPoles").hidden = true;
        renderResearchOptions(question);
      } else {
        $("mbtiPoles").hidden = true;
        $("answers").className = "answers";
        question.options.forEach((option) => addAnswer(option.value, `${option.value}. ${option.text}`));
      }
      $("saveAnswerButton").hidden = !sequential;
      $("saveAnswerButton").textContent = cursor === activeState.total - 1 ? "查看结果" : "下一题";
      $("saveAnswerButton").disabled = busy || !Number.isInteger(answers[cursor]);
      $("previousButton").hidden = false;
      $("previousButton").disabled = busy || cursor === 0;
      $("reviewButton").hidden = sequential || !answers.every(Number.isInteger);
    }
    function renderResearchOptions(question) {
      const bareNumber = option => String(option.text).trim() === String(option.value);
      const labelFor = option => bareNumber(option) ? String(option.value) : `${option.value} · ${option.text}`;
      // Layout follows the consecutive numeric values, not how many labels are supplied.
      // Longer scales retain the existing auto-wrapping track on small screens.
      const numeric = question.options.length >= 4 && question.options.every((option, index, options) =>
        Number.isInteger(option.value) && (!index || option.value === options[index - 1].value + 1));
      $("answers").className = numeric ? "answers mbti" : "answers";
      if (!numeric) {
        question.options.forEach(option => addAnswer(option.value, `${option.value}. ${option.text}`));
        return;
      }
      const ends = document.createElement("div");
      ends.className = "mbti-scale-ends research-scale-ends";
      [question.options[0], question.options[question.options.length - 1]].forEach(option => {
        const label = document.createElement("span");
        label.textContent = labelFor(option);
        ends.append(label);
      });
      $("answers").append(ends);
      const middle = question.options.length % 2 ? question.options[Math.floor(question.options.length / 2)] : null;
      if (middle && !bareNumber(middle)) {
        const label = document.createElement("p");
        label.className = "research-scale-middle";
        label.textContent = labelFor(middle);
        $("answers").append(label);
      }
      const track = document.createElement("div");
      track.className = "mbti-scale-track research-scale-track";
      if (question.options.length <= 7) track.style.gridTemplateColumns = `repeat(${question.options.length}, minmax(0, 1fr))`;
      track.setAttribute("role", "group");
      track.setAttribute("aria-labelledby", "questionText");
      question.options.forEach(option => {
        const button = addAnswer(option.value, String(option.value), track, "scale-step");
        if (!bareNumber(option)) button.setAttribute("aria-label", `${option.value}，${option.text}`);
      });
      const selection = document.createElement("p");
      selection.className = "research-scale-selection";
      const selected = question.options.find(option => option.value === answers[cursor]);
      selection.textContent = selected ? `已选：${labelFor(selected)}` : "";
      $("answers").append(track, selection);
      // Touch and keyboard users can inspect every original label before choosing.
      if (question.options.slice(1, -1).some(option => !bareNumber(option))) {
        const key = document.createElement("details");
        key.className = "research-scale-key";
        const summary = document.createElement("summary");
        summary.textContent = "查看各档含义";
        key.append(summary);
        question.options.forEach(option => {
          const label = document.createElement("p");
          label.textContent = labelFor(option);
          key.append(label);
        });
        $("answers").append(key);
      }
    }
    function renderMbtiScale() {
      const ends = document.createElement("div");

      ends.innerHTML = '<span>B</span><span class="mbti-scale-direction">完全 ← 偏向程度 → 完全</span><span>A</span>';

      const track = document.createElement("div");
      track.className = "mbti-scale-track";
      track.setAttribute("role", "radiogroup");
      track.setAttribute("aria-label", "从完全偏向 B 到完全偏向 A");
      [
        [0, "完全", "完全偏向 B"],
        [1, "较多", "较多偏向 B"],
        [2, "略偏", "略微偏向 B"],
        [3, "略偏", "略微偏向 A"],
        [4, "较多", "较多偏向 A"],
        [5, "完全", "完全偏向 A"]

        button.className = "scale-step";

        button.classList.toggle("selected", answers[cursor] === value);
        button.innerHTML = `<span class="scale-degree">${degree}</span>`;
        button.addEventListener("click", () => answer(value));
        track.appendChild(button);
      });
      $("answers").append(ends, track);
    }

    function addAnswer(value, label, container = $("answers"), className = "answer-button") {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = label;
      button.classList.toggle("selected", answers[cursor] === value);
      if (CONFIG.research) button.setAttribute("aria-pressed", String(answers[cursor] === value));
      button.addEventListener("click", () => answer(value));
      container.appendChild(button);
      return button;

    async function start(edition, discardDraft = false) {
      if (busy) return;
      busy = true;
      showError();
      setButtonsDisabled(true);
      $("statusText").textContent = "SYSTEM / INITIALIZING";
      try {
        if (discardDraft && activeState && !CONFIG.research) localStorage.removeItem(draftKey());
        renderState(await api("start", CONFIG.research ? {mode: edition, restart: !!restartSessionId, confirm: discardDraft, session_id: restartSessionId} : hasModes ? {edition} : {}));
      } catch (error) {
        showError(error.message);
        if (CONFIG.research && activeState) {
          $("statusText").textContent = "SYSTEM / RETRY";
        } else if (hasModes) {
          renderModes();
        } else {
          $("loadingPanel").querySelector("span").textContent = "连接失败，请刷新重试";
          showPanel("loadingPanel");
        }
      } finally {
        busy = false;
        setButtonsDisabled(false);
        if (CONFIG.research && activeState && !activeState.complete) renderQuestion();
      }
    }
    async function answer(value) {
      if (busy || !activeState) return;
      if (CONFIG.research && activeState.mode === "full") {
        answers[cursor] = value;
        try { saveDraft(); }
        catch (_) { showError("本机草稿保存失败，请保存本题后再离开页面。"); }
        const keyOpen = $("answers").querySelector(".research-scale-key")?.open;
        renderQuestion();
        if (keyOpen) $("answers").querySelector(".research-scale-key").open = true;
        $("answers").querySelector(".selected")?.focus({preventScroll: true});
        await saveResearchAnswer(Math.min(cursor + 1, activeState.total - 1), false);
        return;
      }
      answers[cursor] = value;
      if (cursor < activeState.total - 1) cursor += 1;
      try { saveDraft(); }
      catch (error) {
        if (!CONFIG.research) throw error;
        showError("本机草稿保存失败，请勿刷新或关闭页面。");
      }
      if (answers.every(Number.isInteger)) renderReview();
      else renderQuestion();
    }

    async function saveResearchAnswer(nextIndex = cursor + 1, finish = cursor === activeState.total - 1) {
      if (busy || !activeState || activeState.complete || activeState.mode !== "full" || !Number.isInteger(answers[cursor])) return;
      const savedIndex = cursor;
      const keyOpen = $("answers").querySelector(".research-scale-key")?.open;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      busy = true;
      setButtonsDisabled(true);
      showError();
      try {
        const pendingDraft = draftSnapshot();
        const state = await api("save_answer", {session_id: activeState.session_id,
          expected_revision: activeState.answer_revision, index: cursor, answer: answers[cursor], finish}, true, controller.signal);
        renderState(state, pendingDraft);
        if (!state.complete) {
          cursor = Math.max(0, Math.min(nextIndex, state.total - 1, state.progress));
          saveDraft();
        }
      } catch (error) {
        showError(`${error.name === "AbortError" ? "保存请求超时。" : error.message} 未确认保存，可重试；若提示冲突，请刷新核对进度。本机草稿会保留。`);
      } finally {
        clearTimeout(timeout);
        busy = false;
        setButtonsDisabled(false);
        if (!activeState.complete) {
          renderQuestion();
          if (cursor === savedIndex && keyOpen) $("answers").querySelector(".research-scale-key").open = true;
          if (!$("error").hidden) $("saveAnswerButton").focus({preventScroll: true});
          else {
            $("questionText").tabIndex = -1;
            $("questionText").focus({preventScroll: true});
          }
        }
      }
    }

    function goToQuestion(index) {
      if (!activeState || (CONFIG.research && busy)) return;
      if (CONFIG.research && activeState.mode === "full" && Number.isInteger(answers[cursor])
          && answers[cursor] !== activeState.saved_answers[cursor]) {
        saveResearchAnswer(index, false);
        return;
      }
      cursor = Math.max(0, Math.min(index, activeState.total - 1, CONFIG.research && activeState.mode === "full" ? activeState.progress : activeState.total - 1));
      try { saveDraft(); }
      catch (error) {
        if (!CONFIG.research) throw error;
        showError("本机草稿保存失败，请勿刷新或关闭页面。");
      }
      renderQuestion();
      showPanel("questionPanel");
      if (CONFIG.research) {
        $("questionText").tabIndex = -1;
        $("questionText").focus({preventScroll: true});
      }
    }

    function renderReview() {
      if (!activeState || !answers.every(Number.isInteger)) return;
      $("statusText").textContent = "SYSTEM / REVIEW ANSWERS";
      $("reviewSummary").textContent = `已答完 ${activeState.total} 题，确认提交？`;
      showPanel("reviewPanel");
    }

    function makeResultElement(tag, className, text = "") {
      const node = document.createElement(tag);
      node.className = className;
      node.textContent = text;
      return node;
    }

    function resultPercent(value) {
      const number = Number(value);
      return Number.isInteger(number) ? String(number) : number.toFixed(1);
    }

    function validAxis(axis) {
      return axis && typeof axis.left === "string" && typeof axis.right === "string"
        && Number.isFinite(Number(axis.left_percent)) && Number.isFinite(Number(axis.right_percent));
    }

    function appendResultAxes(root, axes, title) {
      const section = makeResultElement("section", "result-section");
      section.appendChild(makeResultElement("h3", "", title));
      const list = makeResultElement("div", "axis-list");
      axes.forEach((axis) => {
        const card = makeResultElement("div", "axis-card");
        const labels = makeResultElement("div", "axis-labels");
        labels.append(
          makeResultElement("span", "", `${axis.left} ${resultPercent(axis.left_percent)}%`),
          makeResultElement("span", "", `${resultPercent(axis.right_percent)}% ${axis.right}`)
        );
        const track = makeResultElement("div", "axis-track");
        const marker = makeResultElement("span", "axis-cursor");
        marker.style.left = `${Math.max(0, Math.min(100, Number(axis.right_percent)))}%`;
        track.appendChild(marker);
        card.append(labels, track);
        list.appendChild(card);
      });
      section.appendChild(list);
      root.appendChild(section);
    }

    function appendResultTextSection(root, title, text) {
      const section = makeResultElement("section", "result-section");
      section.appendChild(makeResultElement("h3", "", title));
      String(text).split(/\n\s*\n/).filter(Boolean).forEach((paragraph) => {
        section.appendChild(makeResultElement("p", "result-copy-paragraph", paragraph));
      });
      root.appendChild(section);
    }

    function appendResultListSection(root, title, items) {
      const section = makeResultElement("section", "result-section");
      section.appendChild(makeResultElement("h3", "", title));
      const list = makeResultElement("ol", "result-list");
      items.forEach((item) => list.appendChild(makeResultElement("li", "", item)));
      section.appendChild(list);
      root.appendChild(section);
    }

    function appendGlossaryCard(root, items) {
      const card = makeResultElement("aside", "glossary-card");
      card.setAttribute("aria-label", "名词小课堂");
      card.appendChild(makeResultElement("h3", "glossary-title", "名词小课堂"));
      items.forEach((item) => {
        const entry = makeResultElement("p", "glossary-entry");
        entry.append(
          makeResultElement("span", "glossary-term", `${item.term}：`),
          document.createTextNode(item.definition)
        );
        card.appendChild(entry);
      });
      root.appendChild(card);
    }

    function renderMbtiResult(root, data) {
      const requiredText = [data.type, data.type_name, data.nickname, data.description, data.strengths, data.weaknesses];
      if (data.kind !== "mbti" || requiredText.some((value) => typeof value !== "string" || !value)
          || !Array.isArray(data.dimensions) || data.dimensions.length !== 4 || !data.dimensions.every(validAxis)) return false;
      const hero = makeResultElement("div", "result-hero");
      hero.append(
        makeResultElement("p", "result-primary", data.type),
        makeResultElement("p", "result-secondary", data.type_name),
        makeResultElement("p", "result-nickname", data.nickname)
      );
      root.appendChild(hero);
      appendResultAxes(root, data.dimensions, "四个维度");
      appendResultTextSection(root, "类型描述", data.description);
      appendResultTextSection(root, "性格优势", data.strengths);
      appendResultTextSection(root, "注意事项", data.weaknesses);
      return true;
    }

    function renderEnneagramResult(root, data) {
      const requiredText = [
        data.type_name,
        data.nickname,
        data.core_desire,
        data.core_fear,
        data.key_motivation,
        data.description,
        data.strengths,
        data.weaknesses
      ];
      if (data.kind !== "enneagram"
          || !Number.isInteger(Number(data.primary_type))
          || requiredText.some((value) => typeof value !== "string" || !value)
          || !Array.isArray(data.centers) || data.centers.length !== 3
          || !Array.isArray(data.glossary_items) || data.glossary_items.length < 1
          || !Array.isArray(data.growth_tips) || data.growth_tips.length < 3
          || !Array.isArray(data.strength_items) || data.strength_items.length < 3
          || !Array.isArray(data.weakness_items) || data.weakness_items.length < 3
          || !data.states || !data.arrows || !data.wings
          || data.centers.some((entry) => !entry || typeof entry.label !== "string" || !Number.isFinite(Number(entry.value)))) return false;
      const hero = makeResultElement("div", "result-hero");
      hero.append(
        makeResultElement("p", "result-primary", `${data.primary_type}号`),
        makeResultElement("p", "result-secondary", data.type_name),
        makeResultElement("p", "result-nickname", data.nickname)
      );
      root.appendChild(hero);
      if (data.is_full) {
        appendResultTextSection(root, "完整型附加判定", `侧翼：${data.wing}\n\nTritype：${data.tritype}`);
      }
      appendMetricBars(
        root,
        data.centers,
        data.is_full ? "脑 / 心 / 腹三中心权重" : "脑 / 心 / 腹三中心相对分（36分制）",
        "metric-bars-large"
      );
      appendResultTextSection(root, "分数量纲说明", data.score_note);
      appendGlossaryCard(root, data.glossary_items);
      appendResultTextSection(root, "主型深度描述", data.description);
      appendResultTextSection(root, "核心恐惧", data.core_fear);
      appendResultTextSection(root, "核心欲望", data.core_desire);
      appendResultTextSection(root, "关键动机", data.key_motivation);

    function drawSinsVirtuesRadar(canvas, axes) {
      if (!canvas?.getContext || !Array.isArray(axes) || axes.length !== 14) return;
      const pageStyles = getComputedStyle(document.documentElement);
      const color = (name) => pageStyles.getPropertyValue(name).trim();
      const colors = {
        grid: color("--purple-light"),
        outline: color("--purple"),
        sin: color("--purple-darker"),
        virtue: color("--pink-dark")
      };
      const bounds = canvas.getBoundingClientRect();
      const cssWidth = Math.max(1, Math.min(520, bounds.width || canvas.parentElement?.clientWidth || 320));
      const compact = cssWidth < 360;
      const cssHeight = Math.round(cssWidth * (compact ? 1.12 : 1.06));
      const pixelRatio = Math.max(1, Number(window.devicePixelRatio) || 1);
      canvas.style.height = `${cssHeight}px`;
      canvas.width = Math.round(cssWidth * pixelRatio);
      canvas.height = Math.round(cssHeight * pixelRatio);
      const context = canvas.getContext("2d");
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      context.clearRect(0, 0, cssWidth, cssHeight);

      const centerX = cssWidth / 2;
      const centerY = cssHeight / 2;
      const labelGap = compact ? 17 : 25;
      const labelAllowance = compact ? 30 : 40;
      const radius = Math.max(44, Math.min(
        centerX - labelGap - labelAllowance,
        centerY - labelGap - (compact ? 25 : 32)
      ));
      const angleFor = (index) => -Math.PI / 2 + index * Math.PI * 2 / axes.length;
      const pointAt = (distance, index) => ({
        x: centerX + Math.cos(angleFor(index)) * distance,
        y: centerY + Math.sin(angleFor(index)) * distance
      });
      const tracePolygon = (points) => {
        context.beginPath();
        points.forEach((point, index) => index ? context.lineTo(point.x, point.y) : context.moveTo(point.x, point.y));
        context.closePath();
      };

      [20, 40, 60, 80, 100].forEach((level) => {
        tracePolygon(axes.map((_axis, index) => pointAt(radius * level / 100, index)));
        context.strokeStyle = level === 100 ? colors.outline : colors.grid;
        context.lineWidth = level === 100 ? 1.5 : 1;
        context.stroke();
      });
      axes.forEach((_axis, index) => {
        const end = pointAt(radius, index);
        context.beginPath();
        context.moveTo(centerX, centerY);
        context.lineTo(end.x, end.y);
        context.strokeStyle = colors.grid;
        context.lineWidth = 1;
        context.stroke();
      });

      const datasetIndexes = {
        virtue: [1, 2, 3, 4, 5, 6, 7],
        sin: [0, 13, 12, 11, 10, 9, 8]
      };
      const drawDataset = (group, stroke) => {
        const points = datasetIndexes[group]
          .map((index) => pointAt(radius * axes[index].score / 100, index));
        const pathPoints = [{x: centerX, y: centerY}, ...points, {x: centerX, y: centerY}];
        tracePolygon(pathPoints);
        context.fillStyle = stroke;
        context.globalAlpha = .2;
        context.fill();
        context.globalAlpha = 1;
        context.strokeStyle = stroke;
        context.lineWidth = compact ? 2 : 2.5;
        context.lineJoin = "round";
        context.stroke();
        points.forEach((point) => {
          context.beginPath();
          context.arc(point.x, point.y, compact ? 2.5 : 3.2, 0, Math.PI * 2);
          context.fillStyle = stroke;
          context.fill();
        });
      };
      drawDataset("sin", colors.sin);
      drawDataset("virtue", colors.virtue);

      const labelRadius = radius + labelGap;
      const labelSize = compact ? 10 : 12;
      axes.forEach((axis, index) => {
        const angle = angleFor(index);
        const position = pointAt(labelRadius, index);
        const horizontal = Math.cos(angle);
        context.textAlign = horizontal > .22 ? "left" : horizontal < -.22 ? "right" : "center";
        context.textBaseline = "alphabetic";
        context.font = `700 ${labelSize}px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif`;
        context.fillStyle = axis.group === "sin" ? colors.sin : colors.virtue;
        context.fillText(axis.label, position.x, position.y);
        context.font = `${labelSize - 1}px "Silkscreen", "Microsoft YaHei", sans-serif`;
        context.fillText(`${resultPercent(axis.score)}%`, position.x, position.y + labelSize + 2);
      });
    }

    function mountSinsVirtuesRadar(canvas, axes) {
      let frame = 0;
      const redraw = () => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => drawSinsVirtuesRadar(canvas, axes));
      };
      redraw();
      if ("ResizeObserver" in window) {
        const observer = new ResizeObserver(redraw);
        observer.observe(canvas);
        return () => { cancelAnimationFrame(frame); observer.disconnect(); };
      }
      window.addEventListener("resize", redraw);
      return () => { cancelAnimationFrame(frame); window.removeEventListener("resize", redraw); };
    }
